version: '3.8'

networks:
  nopsai-net:
    driver: bridge
    name: nopsai-net

volumes:
  db:
    name: db
  keycloak-data:
    name: keycloak-data
    
services:
  base:
    container_name: nopsai-base
    image: hoseindocker/nopsai-base
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: 'true'

  db:
    container_name: nopsai-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: nopsai_db
      POSTGRES_USER: nopsai_user
      POSTGRES_PASSWORD: yoursecurepassword
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      -  db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nopsai_user -d nopsai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nopsai-net

  keycloak:
    container_name: nopsai-keycloak
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --http-port=8082 --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://nopsai-db:5432/nopsai_db
      KC_DB_USERNAME: nopsai_user
      KC_DB_PASSWORD: yoursecurepassword
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - keycloak-data:/opt/keycloak/data
    networks:
      - nopsai-net

  nopsai:
    container_name: nopsai
    image: hoseindocker/nopsai
    build:
      context: .
      dockerfile: container/Dockerfile.nopsai
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      base:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - nopsai-net

  dispatcher:
    container_name: nopsai-dispatcher
    image: hoseindocker/nopsai-dispatcher
    build:
      context: .
      dockerfile: container/Dockerfile.dispatcher
    restart: always
    ports:
      - "9090:9090"
    depends_on:
      - base
    env_file:
      - .env
    networks:
      - nopsai-net

  git-bot:
    container_name: nopsai-git-bot
    image: hoseindocker/nopsai-git-bot
    build:
      context: .
      dockerfile: container/Dockerfile.git-bot
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - db
      - nopsai
    env_file:
      - .env
    networks:
      - nopsai-net

  nopsai-ui:
    container_name: nopsai-ui
    image: hoseindocker/nopsai-ui
    build:
      context: ./services/ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-""}
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nopsai-net
    env_file:
      - .env
    depends_on:
      nopsai:
        condition: service_started
  
  agent:
    container_name: nopsai-agent
    image: hoseindocker/nopsai-agent
    build:
      context: .
      dockerfile: container/Dockerfile.agent
    depends_on:
      - base
    entrypoint: 'true'

  runner:
    container_name: nopsai-runner
    image: hoseindocker/nopsai-runner
    build:
      context: .
      dockerfile: container/Dockerfile.runner
    restart: always
    depends_on:
      - dispatcher
    env_file:
      - .env
    networks:
      - nopsai-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  pipeline:
    container_name: pipeline-image
    image: hoseindocker/pipeline-image
    build:
      context: .
      dockerfile: container/Dockerfile.pipeline
    depends_on:
      - base
    entrypoint: 'true'
