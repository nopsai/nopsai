networks:
  nopsai-net:
    driver: bridge
    name: nopsai-net

volumes:
  db:
    name: db
  go-mod-cache:
  go-build-cache:
  ui-node-modules:
  ui-dist:

x-service-auth-env: &service-auth-env
  SERVICE_JWT_SIGNING_KEY: ${SERVICE_JWT_SIGNING_KEY:-local-dev-service-jwt-key-change-me-please-rotate}

x-local-topology-env: &local-topology-env
  NOPSAI_API_URL: http://nopsai:8080
  DISPATCHER_GRPC_ADDRESS: dispatcher:9090
  DOCKER_NETWORK_NAME: nopsai-net

x-release-build-args: &release-build-args
  VERSION: ${NOPSAI_VERSION:-dev}
  COMMIT: ${NOPSAI_COMMIT:-unknown}
  BUILD_DATE: ${NOPSAI_BUILD_DATE:-unknown}
  RELEASE_MANIFEST_DIGEST: ${NOPSAI_RELEASE_MANIFEST_DIGEST:-}

services:
  base:
    container_name: nopsai-base
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-base:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *release-build-args
    entrypoint: 'true'

  backend-test:
    image: golang:1.26.4
    working_dir: /workspace
    command: ./scripts/test-backend.sh
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  ui-test:
    image: node:22-alpine
    working_dir: /workspace/services/ui
    command: sh -c "npm ci && npm run build"
    volumes:
      - .:/workspace
      - ui-node-modules:/workspace/services/ui/node_modules
      - ui-dist:/workspace/services/ui/dist

  ui-e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /workspace/services/ui
    command: sh -c "npm ci && npm run test:e2e"
    volumes:
      - .:/workspace

  db:
    container_name: nopsai-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: nopsai_db
      POSTGRES_USER: nopsai_user
      POSTGRES_PASSWORD: yoursecurepassword
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nopsai_user -d nopsai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nopsai-net

  nopsai:
    container_name: nopsai
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-api:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.nopsai
      args:
        <<: *release-build-args
        BASE_IMAGE: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-base:${NOPSAI_VERSION:-dev}
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      aaa:
        condition: service_started
      gotenberg:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      base:
        condition: service_completed_successfully
    environment:
      <<: [*service-auth-env, *local-topology-env]
      DATABASE_URL: ${DATABASE_URL:-postgres://nopsai_user:yoursecurepassword@nopsai-db:5432/nopsai_db}
      GIT_BOT_API_URL: http://nopsai-git-bot:8081
      NOPSAI_MASTER_KEY: ${NOPSAI_MASTER_KEY:-4Ns627gVMolptxqC1tePPpOR3FFr04zi3Lk3iHuEV/g=}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-local-dev-jwt-signing-key-change-me-please-rotate}
      AAA_API_URL: http://aaa:8082
      AAA_SHARED_INTERNAL_TOKEN: ${AAA_SHARED_INTERNAL_TOKEN:-local-dev-aaa-token-change-me-please-rotate}
      FINAL_OUTPUT_PDF_RENDERER_URL: http://gotenberg:3000
      FINAL_OUTPUT_PDF_TIMEOUT_SECONDS: ${FINAL_OUTPUT_PDF_TIMEOUT_SECONDS:-45}
      SYSTEM_LOGS_DOCKER_HOST: tcp://docker-socket-proxy:2375
    networks:
      - nopsai-net

  docker-socket-proxy:
    container_name: nopsai-docker-socket-proxy
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-docker-socket-proxy:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.socket-proxy
      args:
        <<: *release-build-args
    restart: always
    environment:
      ALLOWED_CONTAINERS: nopsai,nopsai-aaa,nopsai-dispatcher,nopsai-git-bot,nopsai-ui,nopsai-docker-runner,nopsai-k8s-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - nopsai-net

  gotenberg:
    container_name: nopsai-gotenberg
    image: gotenberg/gotenberg:8.32.0
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - nopsai-net

  aaa:
    container_name: nopsai-aaa
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-aaa:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.aaa
      args:
        <<: *release-build-args
        BASE_IMAGE: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-base:${NOPSAI_VERSION:-dev}
    restart: always
    expose:
      - "8082"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://nopsai_user:yoursecurepassword@nopsai-db:5432/nopsai_db}
      AAA_SHARED_INTERNAL_TOKEN: ${AAA_SHARED_INTERNAL_TOKEN:-local-dev-aaa-token-change-me-please-rotate}
    networks:
      - nopsai-net

  dispatcher:
    container_name: nopsai-dispatcher
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-dispatcher:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.dispatcher
      args:
        <<: *release-build-args
        BASE_IMAGE: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-base:${NOPSAI_VERSION:-dev}
    restart: always
    ports:
      - "9090:9090"
    depends_on:
      - base
    environment:
      <<: *service-auth-env
      NOPSAI_API_URL: http://nopsai:8080
    networks:
      - nopsai-net

  git-bot:
    container_name: nopsai-git-bot
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-git-bot:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.git-bot
      args:
        <<: *release-build-args
        BASE_IMAGE: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-base:${NOPSAI_VERSION:-dev}
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - db
      - nopsai
    environment:
      <<: *service-auth-env
      GIT_BOT_LISTEN_ADDRESS: 0.0.0.0:8081
      NOPSAI_API_URL: http://nopsai:8080
    networks:
      - nopsai-net

  nopsai-ui:
    container_name: nopsai-ui
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-ui:${NOPSAI_VERSION:-dev}
    build:
      context: ./services/ui
      dockerfile: Dockerfile
      args:
        VERSION: ${NOPSAI_VERSION:-dev}
        COMMIT: ${NOPSAI_COMMIT:-unknown}
        BUILD_DATE: ${NOPSAI_BUILD_DATE:-unknown}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nopsai-net
    depends_on:
      nopsai:
        condition: service_started
  
  agent:
    container_name: nopsai-agent
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-agent:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.agent
      args:
        <<: *release-build-args
        BASE_IMAGE: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-base:${NOPSAI_VERSION:-dev}
    depends_on:
      - base
    entrypoint: 'true'

  docker-runner:
    container_name: nopsai-docker-runner
    hostname: docker-runner
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-runner:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.docker-runner
      args:
        <<: *release-build-args
        BASE_IMAGE: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-base:${NOPSAI_VERSION:-dev}
    restart: always
    depends_on:
      - dispatcher
    environment:
      <<: *service-auth-env
      DISPATCHER_GRPC_ADDRESS: dispatcher:9090
      DOCKER_NETWORK_NAME: nopsai-net
    networks:
      - nopsai-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  k8s-runner:
    container_name: nopsai-k8s-runner-image
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-k8s-runner:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.k8s-runner
      args:
        <<: *release-build-args
        BASE_IMAGE: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/nopsai-base:${NOPSAI_VERSION:-dev}
    depends_on:
      - base
    entrypoint: 'true'

  pipeline:
    container_name: pipeline-image
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/hosein-yousefii}/pipeline-image:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.pipeline
      args:
        VERSION: ${NOPSAI_VERSION:-dev}
        COMMIT: ${NOPSAI_COMMIT:-unknown}
        BUILD_DATE: ${NOPSAI_BUILD_DATE:-unknown}
    depends_on:
      - base
    entrypoint: 'true'
