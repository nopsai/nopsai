networks:
  nopsai-net:
    driver: bridge
    name: nopsai-net

volumes:
  db:
    name: db
  go-mod-cache:
  go-build-cache:
  ui-node-modules:
  ui-dist:
    
services:
  base:
    container_name: nopsai-base
    image: hoseindocker/nopsai-base
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: 'true'

  backend-test:
    image: golang:1.26.4
    working_dir: /workspace
    command: ./scripts/test-backend.sh
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  ui-test:
    image: node:22-alpine
    working_dir: /workspace/services/ui
    command: sh -c "npm ci && npm run build"
    volumes:
      - .:/workspace
      - ui-node-modules:/workspace/services/ui/node_modules
      - ui-dist:/workspace/services/ui/dist

  ui-e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /workspace/services/ui
    command: sh -c "npm ci && npm run test:e2e"
    volumes:
      - .:/workspace

  db:
    container_name: nopsai-db
    image: postgres:15
    restart: always
    # depends_on:
    #   ui-test:
    #     condition: "service_completed_successfully"
    #   backend-test:
    #     condition: "service_completed_successfully"
    #   ui-e2e:
    #     condition: "service_completed_successfully"
    environment:
      POSTGRES_DB: nopsai_db
      POSTGRES_USER: nopsai_user
      POSTGRES_PASSWORD: yoursecurepassword
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      -  db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nopsai_user -d nopsai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nopsai-net

  keycloak:
    container_name: nopsai-keycloak
    image: quay.io/keycloak/keycloak:26.6.3
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://192.168.1.143:8088
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8088:8080"
    volumes:
      - ./dev/keycloak/nopsai-realm.json:/opt/keycloak/data/import/nopsai-realm.json:ro
    networks:
      - nopsai-net

  nopsai:
    container_name: nopsai
    image: hoseindocker/nopsai
    build:
      context: .
      dockerfile: container/Dockerfile.nopsai
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      aaa:
        condition: service_started
      base:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - nopsai-net

  aaa:
    container_name: nopsai-aaa
    image: hoseindocker/nopsai-aaa
    build:
      context: .
      dockerfile: container/Dockerfile.aaa
    restart: always
    expose:
      - "8082"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - nopsai-net

  dispatcher:
    container_name: nopsai-dispatcher
    image: hoseindocker/nopsai-dispatcher
    build:
      context: .
      dockerfile: container/Dockerfile.dispatcher
    restart: always
    ports:
      - "9090:9090"
    depends_on:
      - base
    env_file:
      - .env
    networks:
      - nopsai-net

  git-bot:
    container_name: nopsai-git-bot
    image: hoseindocker/nopsai-git-bot
    build:
      context: .
      dockerfile: container/Dockerfile.git-bot
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - db
      - nopsai
    env_file:
      - .env
    networks:
      - nopsai-net

  nopsai-ui:
    container_name: nopsai-ui
    image: hoseindocker/nopsai-ui
    build:
      context: ./services/ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-""}
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nopsai-net
    env_file:
      - .env
    depends_on:
      nopsai:
        condition: service_started
  
  agent:
    container_name: nopsai-agent
    image: hoseindocker/nopsai-agent
    build:
      context: .
      dockerfile: container/Dockerfile.agent
    depends_on:
      - base
    entrypoint: 'true'

  runner:
    container_name: nopsai-runner
    image: hoseindocker/nopsai-runner
    build:
      context: .
      dockerfile: container/Dockerfile.runner
    restart: always
    depends_on:
      - dispatcher
    env_file:
      - .env
    networks:
      - nopsai-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  k8s-runner:
    container_name: nopsai-k8s-runner-image
    image: hoseindocker/nopsai-k8s-runner
    build:
      context: .
      dockerfile: container/Dockerfile.k8s-runner
      args:
        BASE_IMAGE: hoseindocker/nopsai-base:latest
    depends_on:
      - base
    entrypoint: 'true'

  pipeline:
    container_name: pipeline-image
    image: hoseindocker/pipeline-image
    build:
      context: .
      dockerfile: container/Dockerfile.pipeline
    depends_on:
      - base
    entrypoint: 'true'
