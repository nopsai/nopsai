networks:
  nopsai-net:
    driver: bridge
    name: nopsai-net

volumes:
  db:
    name: db

x-service-auth-env: &service-auth-env
  SERVICE_JWT_SIGNING_KEY: ${SERVICE_JWT_SIGNING_KEY:?set SERVICE_JWT_SIGNING_KEY}

x-local-topology-env: &local-topology-env
  NOPSAI_API_URL: http://nopsai:8080
  DISPATCHER_GRPC_ADDRESS: dispatcher:9091

x-observability-env: &observability-env
  NOPSAI_ENV: ${NOPSAI_ENV:-local}

x-compose-safety-env: &compose-safety-env
  NOPSAI_BIND_ADDRESS: ${NOPSAI_BIND_ADDRESS:-127.0.0.1}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  SERVICE_JWT_SIGNING_KEY: ${SERVICE_JWT_SIGNING_KEY:?set SERVICE_JWT_SIGNING_KEY}
  NOPSAI_MASTER_KEY: ${NOPSAI_MASTER_KEY:?set NOPSAI_MASTER_KEY}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
  NOPSAI_BOOTSTRAP_ADMIN_PASSWORD: ${NOPSAI_BOOTSTRAP_ADMIN_PASSWORD:?set NOPSAI_BOOTSTRAP_ADMIN_PASSWORD}
  AAA_SHARED_INTERNAL_TOKEN: ${AAA_SHARED_INTERNAL_TOKEN:?set AAA_SHARED_INTERNAL_TOKEN}

x-release-build-args: &release-build-args
  VERSION: ${NOPSAI_VERSION:-dev}
  COMMIT: ${NOPSAI_COMMIT:-unknown}
  BUILD_DATE: ${NOPSAI_BUILD_DATE:-unknown}
  RELEASE_MANIFEST_DIGEST: ${NOPSAI_RELEASE_MANIFEST_DIGEST:-}

services:
  local-compose-safety:
    container_name: nopsai-local-compose-safety
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    environment:
      <<: *compose-safety-env
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      bind="$${NOPSAI_BIND_ADDRESS:-127.0.0.1}"
      case "$$bind" in
        127.*|localhost|::1|"[::1]") exit 0 ;;
      esac
      failed=0
      check_changed() {
        name="$$1"
        value="$$2"
        default="$$3"
        if [ "$$value" = "$$default" ]; then
          echo "$$name must be changed before binding docker-compose.yaml to $$bind" >&2
          failed=1
        fi
      }
      exit "$$failed"

  base:
    container_name: nopsai-base
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/nopsai-base:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *release-build-args
    entrypoint: 'true'

  db:
    container_name: nopsai-db
    image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    restart: always
    depends_on:
      local-compose-safety:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: nopsai_db
      POSTGRES_USER: nopsai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${NOPSAI_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nopsai_user -d nopsai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nopsai-net

  nopsai:
    container_name: nopsai
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/nopsai-api:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.nopsai
      additional_contexts:
        base: service:base
      args:
        <<: *release-build-args
        BASE_IMAGE: base
    restart: always
    ports:
      - "${NOPSAI_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      local-compose-safety:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      aaa:
        condition: service_started
      gotenberg:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      base:
        condition: service_completed_successfully
    environment:
      <<: [*service-auth-env, *local-topology-env, *observability-env]
      NOPSAI_SERVICE_NAME: nopsai
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      GIT_BOT_API_URL: http://nopsai-git-bot:8081
      NOPSAI_MASTER_KEY: ${NOPSAI_MASTER_KEY:?set NOPSAI_MASTER_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      NOPSAI_BOOTSTRAP_ADMIN_EMAIL: ${NOPSAI_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      NOPSAI_BOOTSTRAP_ADMIN_PASSWORD: ${NOPSAI_BOOTSTRAP_ADMIN_PASSWORD:?set NOPSAI_BOOTSTRAP_ADMIN_PASSWORD}
      NOPSAI_BOOTSTRAP_ADMIN_ALLOW_DEFAULT_PASSWORD: ${NOPSAI_BOOTSTRAP_ADMIN_ALLOW_DEFAULT_PASSWORD:-false}
      NOPSAI_BOOTSTRAP_ADMIN_MUST_CHANGE_PASSWORD: ${NOPSAI_BOOTSTRAP_ADMIN_MUST_CHANGE_PASSWORD:-true}
      AAA_API_URL: http://aaa:8082
      AAA_SHARED_INTERNAL_TOKEN: ${AAA_SHARED_INTERNAL_TOKEN:?set AAA_SHARED_INTERNAL_TOKEN}
      FINAL_OUTPUT_PDF_RENDERER_URL: http://gotenberg:3000
      FINAL_OUTPUT_PDF_TIMEOUT_SECONDS: ${FINAL_OUTPUT_PDF_TIMEOUT_SECONDS:-45}
      RUNTIME_OUTPUT_MAX_BYTES: ${RUNTIME_OUTPUT_MAX_BYTES:-65536}
      SYSTEM_LOGS_DOCKER_HOST: tcp://docker-socket-proxy:2375
    networks:
      - nopsai-net

  docker-socket-proxy:
    container_name: nopsai-docker-socket-proxy
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/nopsai-docker-socket-proxy:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.socket-proxy
      additional_contexts:
        base: service:base
      args:
        <<: *release-build-args
        BASE_IMAGE: base
    restart: always
    depends_on:
      base:
        condition: service_completed_successfully
    environment:
      <<: *observability-env
      NOPSAI_SERVICE_NAME: docker-socket-proxy
      ALLOWED_CONTAINERS: nopsai,nopsai-aaa,nopsai-dispatcher,nopsai-git-bot,nopsai-ui,nopsai-docker-runner,nopsai-k8s-runner,nopsai-docker-socket-proxy,nopsai-gotenberg,nopsai-db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - nopsai-net

  gotenberg:
    container_name: nopsai-gotenberg
    image: gotenberg/gotenberg:8.32.0@sha256:a40c5a46b79d812ce2f5e139278163142a054050bfd1e5f162da36d3d11c7138
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - nopsai-net

  aaa:
    container_name: nopsai-aaa
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/nopsai-aaa:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.aaa
      additional_contexts:
        base: service:base
      args:
        <<: *release-build-args
        BASE_IMAGE: base
    restart: always
    expose:
      - "8082"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *observability-env
      NOPSAI_SERVICE_NAME: aaa
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AAA_SHARED_INTERNAL_TOKEN: ${AAA_SHARED_INTERNAL_TOKEN:?set AAA_SHARED_INTERNAL_TOKEN}
    networks:
      - nopsai-net

  dispatcher:
    container_name: nopsai-dispatcher
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/nopsai-dispatcher:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.dispatcher
      additional_contexts:
        base: service:base
      args:
        <<: *release-build-args
        BASE_IMAGE: base
    restart: always
    ports:
      - "${NOPSAI_BIND_ADDRESS:-127.0.0.1}:9091:9090"
    depends_on:
      local-compose-safety:
        condition: service_completed_successfully
      base:
        condition: service_completed_successfully
    environment:
      <<: [*service-auth-env, *observability-env]
      NOPSAI_SERVICE_NAME: dispatcher
      NOPSAI_API_URL: http://nopsai:8080
    networks:
      - nopsai-net

  git-bot:
    container_name: nopsai-git-bot
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/nopsai-git-bot:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.git-bot
      additional_contexts:
        base: service:base
      args:
        <<: *release-build-args
        BASE_IMAGE: base
    restart: always
    ports:
      - "${NOPSAI_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    depends_on:
      local-compose-safety:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      nopsai:
        condition: service_started
    environment:
      <<: [*service-auth-env, *observability-env]
      NOPSAI_SERVICE_NAME: git-bot
      GIT_BOT_LISTEN_ADDRESS: 0.0.0.0:8081
      NOPSAI_API_URL: http://nopsai:8080
    networks:
      - nopsai-net

  nopsai-ui:
    container_name: nopsai-ui
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/nopsai-ui:${NOPSAI_VERSION:-dev}
    build:
      context: ./services/ui
      dockerfile: Dockerfile
      args:
        VERSION: ${NOPSAI_VERSION:-dev}
        COMMIT: ${NOPSAI_COMMIT:-unknown}
        BUILD_DATE: ${NOPSAI_BUILD_DATE:-unknown}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: always
    ports:
      - "${NOPSAI_BIND_ADDRESS:-127.0.0.1}:80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nopsai-net
    depends_on:
      local-compose-safety:
        condition: service_completed_successfully
      nopsai:
        condition: service_started
  
  agent:
    container_name: nopsai-agent
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/nopsai-agent:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.agent
      additional_contexts:
        base: service:base
      args:
        <<: *release-build-args
        BASE_IMAGE: base
    depends_on:
      - base
    entrypoint: 'true'

  docker-runner:
    container_name: nopsai-docker-runner
    hostname: docker-runner
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/nopsai-docker-runner:${NOPSAI_VERSION:-dev}
    labels:
      nopsai.io/system-log-source: "false"
    build:
      context: .
      dockerfile: container/Dockerfile.docker-runner
      additional_contexts:
        base: service:base
      args:
        <<: *release-build-args
        BASE_IMAGE: base
    entrypoint: 'true'
    depends_on:
      - dispatcher
    environment:
      <<: [*service-auth-env, *local-topology-env, *observability-env]

  k8s-runner:
    container_name: nopsai-k8s-runner-image
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/nopsai-k8s-runner:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.k8s-runner
      additional_contexts:
        base: service:base
      args:
        <<: *release-build-args
        BASE_IMAGE: base
    depends_on:
      - base
    entrypoint: 'true'

  pipeline:
    container_name: pipeline-image
    image: ${NOPSAI_IMAGE_REGISTRY:-ghcr.io/nopsai}/pipeline-image:${NOPSAI_VERSION:-dev}
    build:
      context: .
      dockerfile: container/Dockerfile.pipeline
      args:
        VERSION: ${NOPSAI_VERSION:-dev}
        COMMIT: ${NOPSAI_COMMIT:-unknown}
        BUILD_DATE: ${NOPSAI_BUILD_DATE:-unknown}
    depends_on:
      - base
    entrypoint: 'true'
