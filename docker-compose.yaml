version: '3.8'

networks:
  nopsai-net:
    driver: bridge
    name: nopsai-net

volumes:
  db:
    name: db
    
services:
  base:
    container_name: nopsai-base
    image: nopsai-base
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: 'true'

  db:
    container_name: nopsai-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: nopsai_db
      POSTGRES_USER: nopsai_user
      POSTGRES_PASSWORD: yoursecurepassword
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      -  db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nopsai_user -d nopsai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nopsai-net

  nopsai:
    container_name: nopsai
    image: nopsai
    build:
      context: .
      dockerfile: container/Dockerfile.nopsai
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      base:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - nopsai-net

  dispatcher:
    container_name: nopsai-dispatcher
    image: nopsai-dispatcher
    build:
      context: .
      dockerfile: container/Dockerfile.dispatcher
    restart: always
    ports:
      - "9090:9090"
    depends_on:
      - base
    env_file:
      - .env
    networks:
      - nopsai-net

  git-bot:
    container_name: nopsai-git-bot
    image: nopsai-git-bot
    build:
      context: .
      dockerfile: container/Dockerfile.git-bot
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - db
      - nopsai
    env_file:
      - .env
    networks:
      - nopsai-net

  nopsai-ui:
    image: nginx:alpine
    container_name: nopsai-ui
    ports:
      - "5173:80"
    volumes:
      - ./services/ui/:/usr/share/nginx/html/:ro
    networks:
      - nopsai-net
    depends_on:
      - nopsai
      - dispatcher
  
  agent:
    container_name: nopsai-agent
    image: nopsai-agent
    build:
      context: .
      dockerfile: container/Dockerfile.agent
    depends_on:
      - base
    entrypoint: 'true'

  runner:
    container_name: nopsai-runner
    image: nopsai-runner
    build:
      context: .
      dockerfile: container/Dockerfile.runner
    restart: always
    depends_on:
      - dispatcher
    env_file:
      - .env
    networks:
      - nopsai-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  pipeline:
    container_name: pipeline-image
    image: pipeline-image
    build:
      context: .
      dockerfile: container/Dockerfile.pipeline
    depends_on:
      - base
    entrypoint: 'true'
