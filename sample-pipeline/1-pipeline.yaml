name: First-Test-Pipeline
description: A sample pipeline that will be stored in the database.
container_image: "ubuntu:latest"
working_directory: "/tmp/test"
variables:
  - API_VERSION
steps:
  - name: Say-Hello
    goal: "Print the phrase 'Hello from a real pipeline!' to the console."
  - name: Create-File
    goal: "Create a file named 'pipeline_output.txt' with the content 'Success!'"
  - name: Verify-File
    goal: "Read the contents of the file 'pipeline_output.txt' and print them."
  - name: Javab-test
    goal: "what did you write into previous file?"
    depends_on:
    - Create-File
  - name: working-directory
    goal: what is the working directory
    depends_on:
    - Javab-test
