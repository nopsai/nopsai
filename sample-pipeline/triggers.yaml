# This is the pipeline manifest file.
# It routes GitHub events to the correct pipeline YAML.
triggers:
  # Trigger for pushes to the main branch
  - on: push
    branches:
      - main
    pipelines:
      - main-pipeline.yaml
      - general/include-pipeline
    environment: prod

  # Trigger for pushes to any feature branch
  - on: push
    skip_branches:
      - 'main'
      - 'master'
    pipelines: 
      - branch-pipeline.yaml

  # Trigger for new pull requests
  - on: pull_request
    pipelines: 
      - main-pipeline.yaml
