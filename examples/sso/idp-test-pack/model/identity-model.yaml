important_semantics:
- NopsAI does not use group membership as a login allowlist. The auth-only group is
  merely unmapped.
- team_mapping creates AAA auth-team membership; it does not itself grant product-resource
  access.
- basic_role_mapping creates scoped viewer/developer/owner grants.
- When multiple mapped groups target the same resource, NopsAI keeps the strongest
  product role.
- Only one external identity provider can be enabled per installation.
