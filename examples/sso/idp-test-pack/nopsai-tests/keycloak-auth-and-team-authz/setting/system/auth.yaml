local_enabled: true
oidc:
  enabled: true
  auto_create_users: true
  default_role: ''
  allow_email_linking: true
  domain_mapping:
    example.com: keycloak
  providers:
    keycloak:
      type: keycloak
      display_name: Mock Keycloak
      issuer: http://host.docker.internal:8090/keycloak
      client_id: nopsai-keycloak-test
      scopes:
        - openid
        - email
        - profile
      allowed_email_domains:
        - example.com
      team_claim: groups
      allow_email_linking: true
      team_mapping:
        /nopsai-auth-only: SSO Authenticated
        /nopsai-team-1-viewers: SSO Team 1 Viewers
        /nopsai-team-1-viewers/nopsai-team-1-developers: SSO Team 1 Developers
        /nopsai-data-team-owners: SSO Data Team Owners
      basic_role_mapping:
        /nopsai-team-1-viewers:
          role: viewer
          resource: team:team-1
        /nopsai-team-1-viewers/nopsai-team-1-developers:
          role: developer
          resource: team:team-1
        /nopsai-data-team-owners:
          role: owner
          resource: team:data-team
      authorization_endpoint: http://host.docker.internal:8090/keycloak/authorize
      token_endpoint: http://host.docker.internal:8090/keycloak/token
      jwks_uri: http://host.docker.internal:8090/keycloak/jwks
      userinfo_endpoint: http://host.docker.internal:8090/keycloak/userinfo
