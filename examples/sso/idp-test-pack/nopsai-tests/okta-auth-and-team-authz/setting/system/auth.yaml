local_enabled: true
oidc:
  enabled: true
  auto_create_users: true
  default_role: ''
  allow_email_linking: true
  domain_mapping:
    example.com: okta
  providers:
    okta:
      type: okta
      display_name: Mock Okta
      issuer: http://host.docker.internal:8090/okta
      client_id: nopsai-okta-test
      scopes:
      - openid
      - email
      - profile
      - groups
      allowed_email_domains:
      - example.com
      team_claim: groups
      allow_email_linking: true
      team_mapping:
        nopsai-team-1-viewers: SSO Team 1 Viewers
        nopsai-team-1-developers: SSO Team 1 Developers
        nopsai-data-team-owners: SSO Data Team Owners
      basic_role_mapping:
        nopsai-team-1-viewers:
          role: viewer
          resource: team:team-1
        nopsai-team-1-developers:
          role: developer
          resource: team:team-1
        nopsai-data-team-owners:
          role: owner
          resource: team:data-team
      authorization_endpoint: http://host.docker.internal:8090/okta/authorize
      token_endpoint: http://host.docker.internal:8090/okta/token
      jwks_uri: http://host.docker.internal:8090/okta/jwks
      userinfo_endpoint: http://host.docker.internal:8090/okta/userinfo
