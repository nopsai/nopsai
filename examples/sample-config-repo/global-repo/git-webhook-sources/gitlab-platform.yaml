id: gitlab-platform
name: GitLab Platform
description: Primary GitLab repository event source.
provider: gitlab
enabled: true
team_path: platform
visibility: workspace
auth_mode: static_token
credential_ref: credential://system/webhooks/gitlab-platform
repository_allowlist:
  - acme/service-api
  - platform/*
  - team-1/*
rate_limit:
  per_minute: 120
