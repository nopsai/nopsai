enabled: true
routes:
  - name: release failures
    enabled: true
    recipients:
      include:
        teams:
          - same_team
        users:
          - platform-release@example.com
      exclude:
        users:
          - quiet-hours@example.com
    events:
      failure: true
      success: false
      pending: false
      running: false
      waiting_approval: false
      approval_requested: false
      approval_approved: false
      approval_rejected: true
      cancelled: true
      skipped: false
    filters:
      pipelines:
        include:
          - "*"
      repos:
        include:
          - "*"
      branches:
        include:
          - main
          - release/*
        exclude:
          - dependabot/*
    delivery:
      channels:
        - mail
      throttle:
        dedupe_window: 10m
        max_per_run: 5

  - name: approval requests
    enabled: true
    recipients:
      include:
        teams:
          - team-2/release-approvers
      exclude:
        users:
          - quiet-hours@example.com
    events:
      failure: false
      success: false
      pending: false
      running: false
      waiting_approval: true
      approval_requested: true
      approval_approved: false
      approval_rejected: true
      cancelled: false
      skipped: false
    filters:
      pipelines:
        include:
          - team-2/*
      repos:
        include:
          - "*"
      branches:
        include:
          - main
          - release/*
    delivery:
      channels:
        - mail
      throttle:
        dedupe_window: 15m
        max_per_run: 3
