local_enabled: true

oidc:
  enabled: true
  auto_create_users: true
  default_role: ""
  domain_mapping:
    example.com: nopsai
  providers:
    nopsai:
      type: oidc
      display_name: Enterprise SSO
      issuer: https://sso.example.com/realms/nopsai
      authorization_endpoint: https://sso.example.com/realms/nopsai/protocol/openid-connect/auth
      token_endpoint: https://sso.example.com/realms/nopsai/protocol/openid-connect/token
      jwks_uri: https://sso.example.com/realms/nopsai/protocol/openid-connect/certs
      userinfo_endpoint: https://sso.example.com/realms/nopsai/protocol/openid-connect/userinfo
      client_id: nopsai
      client_credential_ref: credential://system/oidc/nopsai/client-secret
      scopes: ["openid", "email", "profile"]
      allowed_email_domains: ["example.com"]
      allow_email_linking: true
      entitlement_sync:
        mode: keycloak_team_roles
        admin_base_url: https://sso.example.com
        realm: nopsai
        admin_realm: master
        admin_client_id: admin-cli
        admin_client_credential_ref: credential://system/oidc/nopsai/admin-client-secret
        client_id: nopsai
        target_resource_type: team
