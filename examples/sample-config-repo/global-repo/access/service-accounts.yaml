service_accounts:
  - sub: webhook-deployer
    email: webhook-deployer@example.com
    status: active

  - sub: servicenow-prod
    email: servicenow-prod@example.com
    status: active
    advanced_roles:
      - servicenow-prod-external-trigger-runner

  - sub: nopsai-release-bot
    email: nopsai-release-bot@example.com
    status: active
    advanced_roles:
      - nopsai-platform-release-runner

advanced_roles:
  - name: servicenow-prod-external-trigger-runner
    description: Least-privilege ServiceNow production deployment trigger runner.
    policies:
      - name: Invoke deploy-prod external trigger
        resource: external_trigger:deploy-prod
        action: external_trigger.invoke
      - name: Execute platform maintenance pipeline
        resource: pipeline:platform/prod/platform-maintenance
        action: pipeline.execute
      - name: Use platform maintenance pipeline
        resource: pipeline:platform/prod/platform-maintenance
        action: pipeline.use

  - name: nopsai-platform-release-runner
    description: Least-privilege NopsAI self-release package publisher.
    policies:
      - name: Execute NopsAI platform release pipeline
        resource: pipeline:platform/prod/nopsai-platform-release
        action: pipeline.execute
      - name: Use NopsAI platform release pipeline
        resource: pipeline:platform/prod/nopsai-platform-release
        action: pipeline.use
      - name: Read release pipeline runs
        resource: pipeline_run:*
        action: pipeline_run.read

basic_roles:
  - service_account: webhook-deployer
    role: developer
    resource: pipeline:platform/prod/platform-maintenance

  - service_account: nopsai-release-bot
    role: developer
    resource: scope:prod

  - service_account: webhook-deployer
    role: developer
    resource: scope:dev

  - service_account: webhook-deployer
    role: viewer
    resource: trigger:acme/deploy-webhook
