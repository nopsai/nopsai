id: deploy-prod
name: Deploy prod from ServiceNow
description: Authenticated production deployment trigger for approved ServiceNow changes.
enabled: true
pipeline: platform/prod/platform-maintenance
scope: prod
run_team_path: platform/prod
allowed_callers:
  - type: service_account
    id: servicenow-prod
variable_mapping:
  VERSION: payload.version
  CHANGE_ID: payload.change.id
payload_schema:
  type: object
  required:
    - version
rate_limit:
  per_minute: 10
