# GitHub App used by the git-bot for repository events and status updates.
provider: github
app_id: "123456"
# app_slug is filled in automatically when the App is connected from the UI.
app_slug: nopsai-acme
private_key_credential_ref: credential://system/github/app-private-key
webhook_credential_ref: credential://system/github/webhook-secret
installations:
  - installation_id: "987654"
    account_login: acme
    account_type: organization
    enabled: true
