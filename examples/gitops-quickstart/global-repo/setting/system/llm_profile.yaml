# LLM profiles that pipelines and goal tasks can select by name.
default_profile: standard

profiles:
  - name: standard
    provider: gemini
    model: gemini-2.5-flash
    credential_ref: credential://system/llm/gemini
    allowed_scopes: ["dev", "prod"]

  - name: reasoning
    provider: gemini
    model: gemini-2.5-pro
    credential_ref: credential://system/llm/gemini
    max_tokens: 4096
    allowed_scopes: ["prod"]
