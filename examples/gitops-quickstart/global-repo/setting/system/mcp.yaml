# Approved MCP servers and the profiles pipelines may reference.
mcp_servers:
  github:
    display_name: GitHub MCP
    enabled: true
    provider: github
    transport: streamable_http
    url: https://api.githubcopilot.com/mcp/x/all/readonly
    auth_type: bearer_token
    credential_ref: credential://system/mcp/github-readonly
    timeout: 30s
    allowed_scopes: ["dev", "prod"]

mcp_profiles:
  github-readonly:
    description: Read-only GitHub tools for goal tasks.
    enabled: true
    servers:
      - server: github
        tools:
          - "*"
    allowed_scopes: ["dev", "prod"]
