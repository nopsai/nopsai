# One file per model, exactly like a pipeline or a knowledge document.
# Exactly one model per scope may set `default: true`.
default: true
provider: gemini
model: gemini-2.5-flash
credential_ref: credential://system/llm/gemini
allowed_scopes: ["dev", "prod"]
# Optional rate card, so usage can be reported in money rather than in tokens.
# Rates are USD per million tokens, taken from the provider's price list. Omit
# the block when the rate is unknown: usage is then reported as unpriced rather
# than as free. A locally served model has no per-token charge and uses zeroes.
pricing:
  input_per_million_usd: 0.30
  output_per_million_usd: 2.50
  cached_input_per_million_usd: 0.075
