syntax = "proto3";

package proto;

option go_package = "nopsai/pkg/proto";

// The core service that the LLM Agent provides and the Agent consumes.
service AgentService {
  // A bidirectional stream where the agent subscribes for work and reports back results.
  rpc ExecutionStream(stream StreamRequest) returns (stream StreamResponse);
}

// Service for the LLM Agent
service LLMService {
    rpc GetAction(GetActionRequest) returns (Action);
}

message GetActionRequest {
    string step_id = 1;
}

// Message from Agent to LLM Agent
message StreamRequest {
  string run_id = 1;
  oneof event {
    SubscribeRequest subscribe = 2;
    StepResult result = 3;
  }
}

// Agent's initial message to subscribe to work for a run.
message SubscribeRequest {}

// Agent's message to report the result of a step.
message StepResult {
  string step_id = 1;
  string stdout = 2;
  string stderr = 3;
  int32 exit_code = 4;
  string action_taken = 5;
  map<string, string> directory_listing = 6;
}

// Message from LLM Agent to Agent
message StreamResponse {
  oneof event {
    // The LLM Agent sends the full action for a step to be executed.
    RunnableStep step = 1;
    ShutdownRequest shutdown = 2;
  }
}

// A message telling the agent to execute a specific step with its action.
message RunnableStep {
  string step_id = 1;
  Action action = 2;
  string pipeline_name = 3;
  string step_name = 4;
}

// A message telling the agent to shut down.
message ShutdownRequest {
  int32 exit_code = 1;
}

// Action defines the operation for the agent to perform.
message Action {
  string type = 1;
  oneof payload {
    CommandAction command_action = 2;
    FileAction file_action = 3;
    AnswerAction answer_action = 4;
  }
}

message CommandAction {
  string command = 1;
}

message FileAction {
  string path = 1;
  string content = 2;
}

message AnswerAction {
  string answer = 1;
}