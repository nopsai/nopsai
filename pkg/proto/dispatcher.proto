syntax = "proto3";

package proto;

option go_package = "nopsai/pkg/proto";

import "google/protobuf/empty.proto";

// JobRequest is produced by the Nopsai control plane and delivered to a runner.
message JobRequest {
  string run_id = 1;
  string pipeline_name = 2;
  string pipeline_version = 3;
  bytes pipeline_definition = 4;
  repeated string env = 5;
  string agent_image = 6;
  string shared_volume_name = 7;
  string docker_network = 8;
  bool auto_remove = 9;
  string container_name = 10;
  string scope = 11;
  string nopsai_api_url = 12;
  string trigger_event_id = 13;
  string runner_affinity_key = 14;
  string preferred_runner_id = 15;
}

enum JobState {
  JOB_STATE_UNKNOWN = 0;
  JOB_STATE_ASSIGNED = 1;
  JOB_STATE_QUEUED = 2;
  JOB_STATE_REJECTED = 3;
}

message SubmitJobResponse {
  string run_id = 1;
  JobState state = 2;
  string runner_id = 3;
  string message = 4;
}

// Registration info sent once when a runner connects.
message RunnerRegistration {
  string runner_id = 1;
  repeated string scopes = 2;
  int32 capacity = 3;
  map<string, string> metadata = 4;
}

// Heartbeat keeps the dispatcher aware of liveness and current load.
message RunnerHeartbeat {
  string runner_id = 1;
  int32 active_jobs = 2;
}

// JobResult is sent by the runner when it fails to start a job or when it completes.
message JobResult {
  string run_id = 1;
  string status = 2; // accepted, completed, failed, requeued
  string error = 3;
}

message RunnerMessage {
  oneof message {
    RunnerRegistration register = 1;
    RunnerHeartbeat heartbeat = 2;
    JobResult job_result = 3;
  }
}

message DispatcherMessage {
  oneof message {
    JobRequest job = 1;
    string note = 2;
  }
}

service DispatcherService {
  // Called by Nopsai to place a job into the scheduling system.
  rpc SubmitJob(JobRequest) returns (SubmitJobResponse);
  // Long-lived bidirectional stream used by runners.
  rpc Register(stream RunnerMessage) returns (stream DispatcherMessage);
  // Returns current dispatcher health and runner state.
  rpc GetStatus(.google.protobuf.Empty) returns (DispatcherStatus);
  // Toggle whether a runner is eligible to receive new dispatches.
  rpc UpdateRunnerDispatch(UpdateRunnerDispatchRequest) returns (UpdateRunnerDispatchResponse);
  // Agent and runner updates flow through the dispatcher to nopsai.
  rpc IngestLogs(LogBatch) returns (.google.protobuf.Empty);
  rpc ReportTaskStatus(TaskStatusReport) returns (.google.protobuf.Empty);
  rpc FinalizeRun(FinalizeRunRequest) returns (.google.protobuf.Empty);
  rpc FetchPipeline(FetchPipelineRequest) returns (FetchPipelineResponse);
  rpc TriggerPipeline(TriggerPipelineRequest) returns (TriggerPipelineResponse);
  rpc GetRunStatus(RunStatusRequest) returns (RunStatusResponse);
}

message RunnerInfo {
  string runner_id = 1;
  repeated string scopes = 2;
  int32 capacity = 3;
  int32 active_jobs = 4;
  int32 inflight_jobs = 5;
  int64 last_heartbeat_unix = 6;
  map<string, string> metadata = 7;
  bool allow_dispatch = 8;
}

message UpdateRunnerDispatchRequest {
  string runner_id = 1;
  bool allow_dispatch = 2;
  string connection_id = 3;
}

message UpdateRunnerDispatchResponse {
  RunnerInfo runner = 1;
}

message DispatcherStatus {
  repeated RunnerInfo runners = 1;
  int32 queued_jobs = 2;
}

// Agent-facing RPC payloads
message LogBatch {
  string run_id = 1;
  repeated string lines = 2;
}

message TaskStatusReport {
  string run_id = 1;
  string step_name = 2;
  string task_name = 3;
  string status = 4;
  int32 exit_code = 5;
  int64 llm_duration_ms = 6;
}

message FinalizeRunRequest {
  string run_id = 1;
  string status = 2;
}

message FetchPipelineRequest {
  string pipeline_name = 1;
  string repo_owner = 2;
  string repo_name = 3;
  string commit_sha = 4;
}

message FetchPipelineResponse {
  bytes pipeline_definition = 1;
}

message TriggerPipelineRequest {
  string parent_run_id = 1;
  string parent_pipeline_name = 2;
  string parent_step_name = 3;
  string pipeline_identifier = 4;
  bytes pipeline_definition = 5;
  string history = 6;
  string scope = 7;
  map<string, string> git_context = 8;
  string parent_runner_id = 9;
}

message TriggerPipelineResponse {
  string run_id = 1;
  string status = 2;
  string error = 3;
}

message RunStatusRequest {
  string run_id = 1;
}

message RunStatusResponse {
  string status = 1;
}
