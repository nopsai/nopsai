name: UI Live Smoke

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub deployment environment containing the live UI configuration
        required: true
        default: staging
        type: environment
      run_mutation:
        description: Save and execute the dedicated smoke-test pipeline
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      environment:
        description: GitHub deployment environment containing the live UI configuration
        required: false
        default: staging
        type: string
      run_mutation:
        description: Save and execute the dedicated smoke-test pipeline
        required: false
        default: false
        type: boolean
    secrets:
      NOPS_UI_LIVE_USERNAME:
        required: false
      NOPS_UI_LIVE_PASSWORD:
        required: false
      NOPS_UI_LIVE_PIPELINE_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: ui-live-smoke-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authentication:
    name: Authentication and setup smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: services/ui
    env:
      CI: "true"
      NOPS_UI_LIVE_BASE_URL: ${{ vars.NOPS_UI_LIVE_BASE_URL }}
      NOPS_UI_LIVE_USERNAME: ${{ secrets.NOPS_UI_LIVE_USERNAME }}
      NOPS_UI_LIVE_PASSWORD: ${{ secrets.NOPS_UI_LIVE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ui/package-lock.json
      - name: Validate live environment
        run: |
          test -n "$NOPS_UI_LIVE_BASE_URL"
          test -n "$NOPS_UI_LIVE_USERNAME"
          test -n "$NOPS_UI_LIVE_PASSWORD"
      - name: Install UI dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authentication smoke
        run: npm run test:e2e:live:auth
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-live-auth-playwright-report
          path: services/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: Dedicated pipeline mutation smoke
    if: ${{ inputs.run_mutation }}
    needs: authentication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: services/ui
    env:
      CI: "true"
      NOPS_UI_LIVE_BASE_URL: ${{ vars.NOPS_UI_LIVE_BASE_URL }}
      NOPS_UI_LIVE_USERNAME: ${{ secrets.NOPS_UI_LIVE_USERNAME }}
      NOPS_UI_LIVE_PASSWORD: ${{ secrets.NOPS_UI_LIVE_PASSWORD }}
      NOPS_UI_LIVE_MUTATION: "true"
      NOPS_UI_LIVE_PIPELINE_ID: ${{ secrets.NOPS_UI_LIVE_PIPELINE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ui/package-lock.json
      - name: Validate mutation fixture
        run: |
          test -n "$NOPS_UI_LIVE_BASE_URL"
          test -n "$NOPS_UI_LIVE_USERNAME"
          test -n "$NOPS_UI_LIVE_PASSWORD"
          test -n "$NOPS_UI_LIVE_PIPELINE_ID"
      - name: Install UI dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mutation smoke
        run: npm run test:e2e:live:mutation
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-live-mutation-playwright-report
          path: services/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 14
