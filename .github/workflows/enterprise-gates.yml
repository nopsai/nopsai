name: Enterprise Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go test
        run: go test ./...
      - name: Go race test
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: gosec
        run: gosec -exclude=G101,G103,G104,G110,G115,G118,G122,G301,G304,G306,G703,G704 ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  docker-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build base image
        run: docker build -t nopsai-base:ci -f Dockerfile .
      - name: Build service images
        run: |
          docker build -t nopsai-agent:ci -f container/Dockerfile.agent .
          docker build -t nopsai-aaa:ci -f container/Dockerfile.aaa .
          docker build -t nopsai-pipeline:ci -f container/Dockerfile.pipeline .
          docker build --build-arg BASE_IMAGE=nopsai-base:ci -t nopsai-api:ci -f container/Dockerfile.nopsai .
          docker build --build-arg BASE_IMAGE=nopsai-base:ci -t nopsai-dispatcher:ci -f container/Dockerfile.dispatcher .
          docker build --build-arg BASE_IMAGE=nopsai-base:ci -t nopsai-git-bot:ci -f container/Dockerfile.git-bot .
          docker build --build-arg BASE_IMAGE=nopsai-base:ci -t nopsai-runner:ci -f container/Dockerfile.runner .
          docker build --build-arg BASE_IMAGE=nopsai-base:ci -t nopsai-k8s-runner:ci -f container/Dockerfile.k8s-runner .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ui/package-lock.json
      - name: Build UI image
        run: docker build -t nopsai-ui:ci -f services/ui/Dockerfile services/ui
