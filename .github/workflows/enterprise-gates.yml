name: Enterprise Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go test
        run: scripts/test-backend.sh
      - name: Go race test
        run: scripts/test-backend.sh -race
      - name: Go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: gosec
        run: gosec -exclude=G101,G103,G104,G110,G115,G118,G122,G301,G304,G306,G703,G704 ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  ui-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
      - name: UI lint
        run: npm run lint
      - name: UI boundary check
        run: npm run check:ui-boundaries
      - name: UI tests
        run: npm run test
      - name: UI build
        run: npm run build
