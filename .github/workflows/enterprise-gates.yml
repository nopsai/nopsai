name: Enterprise Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      build_date: ${{ steps.build-date.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.3
      - name: Calculate commit-count release version
        id: metadata
        env:
          VERSION_OFFSET: ${{ github.event_name == 'pull_request' && '2' || '0' }}
        run: scripts/release-version.sh --offset "$VERSION_OFFSET" --format github >>"$GITHUB_OUTPUT"
      - name: Capture build date
        id: build-date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
      - name: Validate release tooling
        run: scripts/release-tooling-test.sh
      - name: Build versioned CLI preview
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
          BUILD_DATE: ${{ steps.build-date.outputs.value }}
        run: |
          mkdir -p dist
          BUILD_LDFLAGS="-s -w -X nopsai/pkg/buildinfo.Version=${VERSION} -X nopsai/pkg/buildinfo.Commit=${SOURCE_COMMIT} -X nopsai/pkg/buildinfo.BuildDate=${BUILD_DATE} -X nopsai/pkg/buildinfo.APIVersion=v1 -X nopsai/pkg/buildinfo.RunnerProtocolVersion=1 -X nopsai/pkg/buildinfo.CLICompatibility=>=2.0.0,<3.0.0 -X nopsai/pkg/buildinfo.RunnerCompatibility=>=2.0.0,<3.0.0 -X nopsai/pkg/buildinfo.PlatformCompatibility=>=2.0.0,<3.0.0"
          CGO_ENABLED=0 go build -trimpath -ldflags="$BUILD_LDFLAGS" -o dist/nopsai ./cmd/nopsai-cli
          dist/nopsai --version | grep -F "$VERSION"
      - name: Render release preview
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
          BUILD_DATE: ${{ steps.build-date.outputs.value }}
        run: |
          scripts/render-release-bundle.sh \
            --output dist/release-preview \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" \
            --version "$VERSION" \
            --commit "$SOURCE_COMMIT" \
            --build-date "$BUILD_DATE"
          scripts/generate-changelog.sh "$VERSION" dist/release-preview/CHANGELOG.md
          cp dist/nopsai dist/release-preview/nopsai-linux-amd64
      - name: Upload release preview
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-${{ steps.metadata.outputs.version }}
          path: dist/release-preview
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go test
        run: scripts/test-backend.sh
      - name: Go race test
        run: scripts/test-backend.sh -race
      - name: Go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: gosec
        run: gosec -exclude=G101,G103,G104,G110,G115,G118,G122,G301,G304,G306,G703,G704 ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  docker-builds:
    needs: release-contract
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-contract.outputs.version }}
      SOURCE_COMMIT: ${{ needs.release-contract.outputs.source_commit }}
      BUILD_DATE: ${{ needs.release-contract.outputs.build_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build base image
        run: |
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$SOURCE_COMMIT" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            -t "nopsai-base:$VERSION" -f Dockerfile .
      - name: Build service images
        run: |
          release_args=(--build-arg "VERSION=$VERSION" --build-arg "COMMIT=$SOURCE_COMMIT" --build-arg "BUILD_DATE=$BUILD_DATE")
          base_args=(--build-arg "BASE_IMAGE=nopsai-base:$VERSION" "${release_args[@]}")
          docker build "${release_args[@]}" -t "nopsai-agent:$VERSION" -f container/Dockerfile.agent .
          docker build "${release_args[@]}" -t "nopsai-aaa:$VERSION" -f container/Dockerfile.aaa .
          docker build "${release_args[@]}" -t "nopsai-docker-socket-proxy:$VERSION" -f container/Dockerfile.socket-proxy .
          docker build "${release_args[@]}" -t "pipeline-image:$VERSION" -f container/Dockerfile.pipeline .
          docker build "${base_args[@]}" -t "nopsai-api:$VERSION" -f container/Dockerfile.nopsai .
          docker build "${base_args[@]}" -t "nopsai-dispatcher:$VERSION" -f container/Dockerfile.dispatcher .
          docker build "${base_args[@]}" -t "nopsai-git-bot:$VERSION" -f container/Dockerfile.git-bot .
          docker build "${base_args[@]}" -t "nopsai-runner:$VERSION" -f container/Dockerfile.docker-runner .
          docker build "${base_args[@]}" -t "nopsai-k8s-runner:$VERSION" -f container/Dockerfile.k8s-runner .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ui/package-lock.json
      - name: Build UI image
        run: |
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$SOURCE_COMMIT" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            -t "nopsai-ui:$VERSION" -f services/ui/Dockerfile services/ui

  ui-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
      - name: UI lint
        run: npm run lint
      - name: UI boundary check
        run: npm run check:ui-boundaries
      - name: UI tests
        run: npm run test
      - name: UI build
        run: npm run build
