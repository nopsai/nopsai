name: Platform Release

on:
  workflow_run:
    workflows: [Enterprise Gates]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-release-main
  cancel-in-progress: false

jobs:
  metadata:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.metadata.outputs.eligible }}
      version: ${{ steps.metadata.outputs.version }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      registry: ${{ steps.metadata.outputs.registry }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
      - name: Validate release source and calculate version
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force --tags origin main:refs/remotes/origin/main
          source_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          eligible=true
          if [[ "$source_commit" != "$main_commit" ]]; then
            echo "Skipping stale release source $source_commit; current main is $main_commit"
            eligible=false
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$eligible" == "true" ]]; then
            gate_conclusion=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/enterprise-gates.yml/runs" \
              -f "head_sha=$source_commit" \
              -f status=completed \
              -f per_page=20 \
              --jq '[.workflow_runs[] | select(.event == "push")][0].conclusion // ""')
            if [[ "$gate_conclusion" != "success" ]]; then
              echo "No successful main Enterprise Gates run found for $source_commit" >&2
              exit 1
            fi
          fi
          scripts/release-version.sh --ref "$source_commit" --format github >>"$GITHUB_OUTPUT"
          version=$(scripts/release-version.sh --ref "$source_commit")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; skipping"
            eligible=false
          fi
          echo "eligible=$eligible" >>"$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"

  publish-base:
    needs: metadata
    if: ${{ needs.metadata.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.source_commit }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish base image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.metadata.outputs.registry }}/nopsai-base:${{ needs.metadata.outputs.version }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.source_commit }}
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=nopsai-base
          cache-to: type=gha,mode=max,scope=nopsai-base
      - name: Save base digest
        run: |
          mkdir -p digest
          echo '${{ steps.build.outputs.digest }}' >digest/nopsai-base.digest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-nopsai-base
          path: digest
          if-no-files-found: error

  publish-images:
    needs: [metadata, publish-base]
    if: ${{ needs.metadata.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nopsai-api
            context: .
            file: container/Dockerfile.nopsai
          - name: nopsai-aaa
            context: .
            file: container/Dockerfile.aaa
          - name: nopsai-agent
            context: .
            file: container/Dockerfile.agent
          - name: nopsai-dispatcher
            context: .
            file: container/Dockerfile.dispatcher
          - name: nopsai-git-bot
            context: .
            file: container/Dockerfile.git-bot
          - name: nopsai-runner
            context: .
            file: container/Dockerfile.docker-runner
          - name: nopsai-k8s-runner
            context: .
            file: container/Dockerfile.k8s-runner
          - name: nopsai-docker-socket-proxy
            context: .
            file: container/Dockerfile.socket-proxy
          - name: nopsai-ui
            context: services/ui
            file: services/ui/Dockerfile
          - name: pipeline-image
            context: .
            file: container/Dockerfile.pipeline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.source_commit }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.metadata.outputs.registry }}/${{ matrix.name }}:${{ needs.metadata.outputs.version }}
          build-args: |
            BASE_IMAGE=${{ needs.metadata.outputs.registry }}/nopsai-base:${{ needs.metadata.outputs.version }}
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.source_commit }}
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Save image digest
        run: |
          mkdir -p digest
          echo '${{ steps.build.outputs.digest }}' >'digest/${{ matrix.name }}.digest'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.name }}
          path: digest
          if-no-files-found: error

  build-cli:
    needs: metadata
    if: ${{ needs.metadata.outputs.eligible == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-14
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.metadata.outputs.source_commit }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build standalone CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
        run: |
          mkdir -p dist package
          binary=nopsai
          if [[ "$GOOS" == "windows" ]]; then binary=nopsai.exe; fi
          BUILD_LDFLAGS="-s -w -X nopsai/pkg/buildinfo.Version=${VERSION} -X nopsai/pkg/buildinfo.Commit=${SOURCE_COMMIT} -X nopsai/pkg/buildinfo.BuildDate=${BUILD_DATE} -X nopsai/pkg/buildinfo.APIVersion=v1 -X nopsai/pkg/buildinfo.RunnerProtocolVersion=1 -X nopsai/pkg/buildinfo.CLICompatibility=>=2.0.0,<3.0.0 -X nopsai/pkg/buildinfo.RunnerCompatibility=>=2.0.0,<3.0.0 -X nopsai/pkg/buildinfo.PlatformCompatibility=>=2.0.0,<3.0.0"
          CGO_ENABLED=0 go build -trimpath -ldflags="$BUILD_LDFLAGS" -o "package/$binary" ./cmd/nopsai-cli
          asset="nopsai_${VERSION}_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            (cd package && zip -9 "../dist/${asset}.zip" "$binary")
          elif [[ "$GOOS" == "linux" ]]; then
            tar -C package -czf "dist/${asset}.tar.gz" "$binary"
          fi
      - name: Sign and notarize macOS CLI
        if: ${{ matrix.goos == 'darwin' }}
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          VERSION: ${{ needs.metadata.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          scripts/sign-notarize-macos-cli.sh \
            --binary package/nopsai \
            --archive "dist/nopsai_${VERSION}_darwin_${GOARCH}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
          if-no-files-found: error

  publish-release:
    needs: [metadata, publish-base, publish-images, build-cli]
    if: ${{ needs.metadata.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.metadata.outputs.version }}
      SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
      BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
      REGISTRY: ${{ needs.metadata.outputs.registry }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.source_commit }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: dist/digests
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      - name: Render immutable deployment bundle
        run: |
          scripts/render-release-bundle.sh \
            --output dist/release \
            --registry "$REGISTRY" \
            --version "$VERSION" \
            --commit "$SOURCE_COMMIT" \
            --build-date "$BUILD_DATE" \
            --digest-dir dist/digests
          scripts/generate-changelog.sh "$VERSION" dist/release/CHANGELOG.md "$SOURCE_COMMIT"
          mkdir -p dist/assets
          index_file=dist/release/release-index.json
          temp_index="$index_file.tmp"
          jq '.cli = {}' "$index_file" >"$temp_index"
          mv "$temp_index" "$index_file"
          for asset in dist/cli/*; do
            asset_name=$(basename "$asset")
            checksum=$(shasum -a 256 "$asset" | awk '{print $1}')
            jq --arg name "$asset_name" --arg checksum "sha256:$checksum" '.cli[$name] = $checksum' "$index_file" >"$temp_index"
            mv "$temp_index" "$index_file"
          done
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin
          chart_repository="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          chart_reference="$chart_repository/nopsai"
          chart_push_output=$(helm push "dist/release/nopsai-$VERSION.tgz" "$chart_repository")
          printf '%s\n' "$chart_push_output"
          chart_digest=$(printf '%s\n' "$chart_push_output" | sed -n 's/^Digest: //p' | tail -1)
          if [[ ! "$chart_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Helm did not return a valid OCI chart digest" >&2
            exit 1
          fi
          jq \
            --arg reference "$chart_reference" \
            --arg digest "$chart_digest" \
            '.chart.ociReference=$reference | .chart.digest=$digest' \
            "$index_file" >"$temp_index"
          mv "$temp_index" "$index_file"
          (
            cd dist/release
            shasum -a 256 .env db/init.sql docker-compose.yaml "nopsai-$VERSION.tgz" release-index.json >checksums.txt
          )
          cp dist/cli/* dist/assets/
          cp dist/release/CHANGELOG.md dist/assets/
          cp dist/release/docker-compose.yaml dist/assets/nopsai-docker-compose.yaml
          cp "dist/release/nopsai-$VERSION.tgz" dist/assets/
          cp dist/release/release-index.json dist/assets/
          tar -C dist/release -czf "dist/assets/nopsai_${VERSION}_deployment-bundle.tar.gz" .
          (
            cd dist/assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 >SHA256SUMS
          )
      - name: Validate released Compose file
        run: |
          cp dist/release/.env dist/release/.env.images
          cat >>dist/release/.env <<'EOF'
          SERVICE_JWT_SIGNING_KEY=release-validation-service-signing-key-32
          POSTGRES_PASSWORD=release-validation-postgres-password
          DATABASE_URL=postgres://nopsai_user:release-validation-postgres-password@db:5432/nopsai_db
          AAA_SHARED_INTERNAL_TOKEN=release-validation-aaa-token-32-chars
          NOPSAI_MASTER_KEY=cmVsZWFzZS12YWxpZGF0aW9uLW1hc3Rlci1rZXk=
          JWT_SIGNING_KEY=release-validation-jwt-signing-key-32
          EOF
          docker compose --env-file dist/release/.env -f dist/release/docker-compose.yaml config --quiet
          mv dist/release/.env.images dist/release/.env
      - name: Upload complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nopsai-${{ needs.metadata.outputs.version }}
          path: dist/assets
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release
        run: |
          gh release create "v$VERSION" dist/assets/* \
            --target "$SOURCE_COMMIT" \
            --title "NopsAI $VERSION" \
            --notes-file dist/release/CHANGELOG.md
