name: nopsai-platform-release
version: "1.0.0"
description: Build and publish NopsAI container images, versioned Helm chart, CLI archives, changelog, and checksums from a NopsAI pipeline run.
container_image: alpine:3.20
working_directory: /workspace
timeout: 3h
llm_enabled: false
llm_content_sharing: false
llm_output_sharing: false
display_options:
  github_view: mermaid
access:
  visibility: restricted
  use_access:
    grants:
      - repository: hosein-yousefii/pre-nopsai
      - service_account: nopsai-release-bot
variables:
  - NOPSAI_RELEASE_REPOSITORY_URL
  - NOPSAI_RELEASE_SOURCE_REF
  - NOPSAI_RELEASE_REQUIRE_MAIN
  - NOPSAI_RELEASE_ALLOW_EXISTING
  - NOPSAI_RELEASE_REGISTRY
  - NOPSAI_RELEASE_GITHUB_REPOSITORY
  - NOPSAI_RELEASE_GHCR_USERNAME
  - NOPSAI_RELEASE_PLATFORMS
  - NOPSAI_RELEASE_ENABLE_QEMU
  - NOPSAI_RELEASE_BUILDX_NAME
  - NOPSAI_RELEASE_HELM_VERSION
  - NOPSAI_RELEASE_GH_VERSION
  - DOCKER_HOST
steps:
  - name: checkout-repository
    image: alpine:3.20
    secrets:
      - NOPSAI_RELEASE_GITHUB_TOKEN
    script: |
      set -eu
      apk add --no-cache bash git
      bash <<'BASH'
      set -euo pipefail

      repo_url="${NOPSAI_RELEASE_REPOSITORY_URL:-${GIT_CLONE_URL:-}}"
      if [[ -z "$repo_url" && -n "${NOPSAI_RELEASE_GITHUB_REPOSITORY:-}" ]]; then
        repo_url="https://github.com/${NOPSAI_RELEASE_GITHUB_REPOSITORY}.git"
      fi
      if [[ -z "$repo_url" ]]; then
        echo "NOPSAI_RELEASE_REPOSITORY_URL, GIT_CLONE_URL, or NOPSAI_RELEASE_GITHUB_REPOSITORY is required for checkout" >&2
        exit 1
      fi

      if [[ -n "${NOPSAI_RELEASE_GITHUB_TOKEN:-}" ]]; then
        printf '%s\n' \
          '#!/bin/sh' \
          'case "$1" in' \
          '  *Username*) printf "%s\n" "x-access-token" ;;' \
          '  *Password*) printf "%s\n" "$NOPSAI_RELEASE_GITHUB_TOKEN" ;;' \
          '  *) printf "\n" ;;' \
          'esac' >/tmp/nopsai-git-askpass
        chmod 700 /tmp/nopsai-git-askpass
        export GIT_ASKPASS=/tmp/nopsai-git-askpass
      fi
      export GIT_TERMINAL_PROMPT=0

      if [[ -d .git ]]; then
        git remote set-url origin "$repo_url" 2>/dev/null || git remote add origin "$repo_url"
      else
        if find . -mindepth 1 -maxdepth 1 | grep -q .; then
          echo "Workspace is not empty and is not a git checkout; refusing to clone over existing files" >&2
          exit 1
        fi
        git init .
        git remote add origin "$repo_url"
      fi

      source_ref="${NOPSAI_RELEASE_SOURCE_REF:-${GIT_COMMIT_SHA:-main}}"
      git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

      checkout_ref=""
      if git rev-parse --verify --quiet "$source_ref^{commit}" >/dev/null; then
        checkout_ref="$source_ref"
      elif git rev-parse --verify --quiet "origin/$source_ref^{commit}" >/dev/null; then
        checkout_ref="origin/$source_ref"
      elif [[ "$source_ref" == refs/heads/* ]] && git rev-parse --verify --quiet "origin/${source_ref#refs/heads/}^{commit}" >/dev/null; then
        checkout_ref="origin/${source_ref#refs/heads/}"
      elif [[ "$source_ref" == refs/tags/* ]] && git rev-parse --verify --quiet "${source_ref#refs/tags/}^{commit}" >/dev/null; then
        checkout_ref="${source_ref#refs/tags/}"
      else
        git fetch --force origin "$source_ref"
        checkout_ref="FETCH_HEAD"
      fi

      git checkout --detach "$checkout_ref"
      git reset --hard
      git clean -ffdx
      echo "checked_out_commit=$(git rev-parse HEAD)"
      BASH

  - name: release-metadata
    image: alpine:3.20
    depends_on:
      - checkout-repository
    secrets:
      - NOPSAI_RELEASE_GITHUB_TOKEN
    script: |
      set -eu
      apk add --no-cache bash coreutils git
      bash <<'BASH'
      set -euo pipefail

      if [[ -n "${NOPSAI_RELEASE_GITHUB_TOKEN:-}" ]]; then
        printf '%s\n' \
          '#!/bin/sh' \
          'case "$1" in' \
          '  *Username*) printf "%s\n" "x-access-token" ;;' \
          '  *Password*) printf "%s\n" "$NOPSAI_RELEASE_GITHUB_TOKEN" ;;' \
          '  *) printf "\n" ;;' \
          'esac' >/tmp/nopsai-git-askpass
        chmod 700 /tmp/nopsai-git-askpass
        export GIT_ASKPASS=/tmp/nopsai-git-askpass
      fi
      export GIT_TERMINAL_PROMPT=0

      source_ref="${NOPSAI_RELEASE_SOURCE_REF:-HEAD}"
      require_main="${NOPSAI_RELEASE_REQUIRE_MAIN:-true}"
      allow_existing="${NOPSAI_RELEASE_ALLOW_EXISTING:-false}"

      git fetch --force --tags origin main:refs/remotes/origin/main
      if [[ "$source_ref" != "HEAD" ]]; then
        git fetch --force --tags origin "$source_ref" || git fetch --force --tags origin
        if git rev-parse --verify --quiet "$source_ref^{commit}" >/dev/null; then
          git checkout --detach "$source_ref"
        elif git rev-parse --verify --quiet "origin/$source_ref^{commit}" >/dev/null; then
          git checkout --detach "origin/$source_ref"
        else
          echo "Unable to resolve NOPSAI_RELEASE_SOURCE_REF=$source_ref" >&2
          exit 1
        fi
      fi

      source_commit="$(git rev-parse HEAD)"
      main_commit="$(git rev-parse origin/main)"
      if [[ "$require_main" == "true" && "$source_commit" != "$main_commit" ]]; then
        echo "Release source $source_commit is not current origin/main $main_commit" >&2
        exit 1
      fi

      version="$(scripts/release-version.sh --ref "$source_commit")"
      should_release=true
      if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
        tag_commit="$(git rev-list -n 1 "refs/tags/v$version")"
        if [[ "$tag_commit" != "$source_commit" ]]; then
          echo "Release tag v$version points to $tag_commit, not $source_commit" >&2
          exit 1
        fi
        if [[ "$allow_existing" == "true" ]]; then
          echo "Release v$version already exists; package publication will run in recovery mode"
        else
          echo "Release v$version already exists; downstream publishing steps will skip"
          should_release=false
        fi
      fi

      repo="${NOPSAI_RELEASE_GITHUB_REPOSITORY:-}"
      if [[ -z "$repo" ]]; then
        remote_url="$(git config --get remote.origin.url || true)"
        case "$remote_url" in
          https://github.com/*)
            repo="${remote_url#https://github.com/}"
            repo="${repo%.git}"
            ;;
          git@github.com:*)
            repo="${remote_url#git@github.com:}"
            repo="${repo%.git}"
            ;;
        esac
      fi
      if [[ "$repo" != */* ]]; then
        echo "NOPSAI_RELEASE_GITHUB_REPOSITORY must be owner/repository when origin is not a GitHub remote" >&2
        exit 1
      fi
      repo_owner="${repo%%/*}"
      repo_owner_lower="$(printf '%s' "$repo_owner" | tr '[:upper:]' '[:lower:]')"
      registry="${NOPSAI_RELEASE_REGISTRY:-ghcr.io/$repo_owner_lower}"
      ghcr_username="${NOPSAI_RELEASE_GHCR_USERNAME:-$repo_owner}"
      platforms="${NOPSAI_RELEASE_PLATFORMS:-linux/amd64,linux/arm64}"

      mkdir -p dist/release
      {
        printf 'VERSION=%q\n' "$version"
        printf 'SOURCE_COMMIT=%q\n' "$source_commit"
        printf 'BUILD_DATE=%q\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        printf 'REGISTRY=%q\n' "${registry%/}"
        printf 'GITHUB_REPOSITORY=%q\n' "$repo"
        printf 'GITHUB_REPOSITORY_OWNER=%q\n' "$repo_owner"
        printf 'GHCR_USERNAME=%q\n' "$ghcr_username"
        printf 'PLATFORMS=%q\n' "$platforms"
        printf 'ALLOW_EXISTING_RELEASE=%q\n' "$allow_existing"
        printf 'SHOULD_RELEASE=%q\n' "$should_release"
      } >dist/release/env

      echo "release_version=$version"
      echo "source_commit=$source_commit"
      echo "registry=${registry%/}"
      echo "should_release=$should_release"
      BASH

  - name: quality-gates
    image: golang:1.26.5-alpine
    depends_on:
      - release-metadata
    script: |
      set -eu
      apk add --no-cache bash build-base coreutils curl docker-cli docker-cli-compose git jq perl-utils ruby tar gzip
      bash <<'BASH'
      set -euo pipefail

      install_helm() {
        if command -v helm >/dev/null 2>&1; then
          return
        fi
        local version="${NOPSAI_RELEASE_HELM_VERSION:-3.17.3}"
        local arch
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "Unsupported Helm install architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        curl -fsSL "https://get.helm.sh/helm-v${version}-linux-${arch}.tar.gz" -o /tmp/helm.tgz
        tar -C /tmp -xzf /tmp/helm.tgz
        mv "/tmp/linux-${arch}/helm" /usr/local/bin/helm
        chmod +x /usr/local/bin/helm
      }

      . dist/release/env
      if [[ "$SHOULD_RELEASE" != "true" ]]; then
        echo "Release v$VERSION already exists; skipping quality gates"
        exit 0
      fi

      install_helm
      scripts/test-backend.sh
      scripts/test-backend.sh -race
      scripts/release-tooling-test.sh
      BASH

  - name: ui-gates
    image: node:22-alpine
    depends_on:
      - release-metadata
    script: |
      set -eu
      apk add --no-cache bash
      bash <<'BASH'
      set -euo pipefail

      . dist/release/env
      if [[ "$SHOULD_RELEASE" != "true" ]]; then
        echo "Release v$VERSION already exists; skipping UI gates"
        exit 0
      fi

      cd services/ui
      npm ci
      npm run lint
      npm run check:ui-boundaries
      npm run test
      npm run build
      BASH

  - name: publish-base-image
    image: docker:27-cli
    depends_on:
      - quality-gates
      - ui-gates
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash <<'BASH'
      set -euo pipefail

      . dist/release/env
      mkdir -p dist/release
      cat >dist/release/publish-release-image.sh <<'IMAGE_SCRIPT'
      #!/usr/bin/env bash
      set -euo pipefail

      if [[ $# -ne 3 ]]; then
        echo "usage: publish-release-image.sh <image-name> <context-path> <dockerfile-path>" >&2
        exit 2
      fi

      image_name="$1"
      context_path="$2"
      dockerfile_path="$3"

      . dist/release/env
      if [[ "$SHOULD_RELEASE" != "true" ]]; then
        echo "Release v$VERSION already exists; skipping $image_name publication"
        exit 0
      fi
      if [[ -z "${NOPSAI_RELEASE_GHCR_TOKEN:-}" ]]; then
        echo "NOPSAI_RELEASE_GHCR_TOKEN is required to publish container images" >&2
        exit 1
      fi
      if [[ ! -s dist/digests/nopsai-base.digest ]]; then
        echo "Base image digest is required before publishing $image_name" >&2
        exit 1
      fi

      base_digest="$(tr -d '\r\n' <dist/digests/nopsai-base.digest)"
      if [[ ! "$base_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
        echo "Invalid base image digest for $image_name: $base_digest" >&2
        exit 1
      fi

      printf '%s' "$NOPSAI_RELEASE_GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      builder_suffix="$(printf '%s-%s-%s' "$VERSION" "$image_name" "$$" | tr -c 'A-Za-z0-9_.-' '-')"
      builder="${NOPSAI_RELEASE_BUILDX_NAME:-nopsai-release-builder}-${builder_suffix}"
      if ! docker buildx inspect "$builder" >/dev/null 2>&1; then
        docker buildx create --name "$builder" --driver docker-container --use
      else
        docker buildx use "$builder"
      fi
      trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
      docker buildx inspect --bootstrap

      mkdir -p dist/digests dist/docker-metadata
      metadata_file="dist/docker-metadata/${image_name}.json"
      echo "Building and publishing $image_name"
      docker buildx build \
        --file "$dockerfile_path" \
        --platform "$PLATFORMS" \
        --push \
        --tag "$REGISTRY/$image_name:$VERSION" \
        --build-arg "BASE_IMAGE=$REGISTRY/nopsai-base@$base_digest" \
        --build-arg "VERSION=$VERSION" \
        --build-arg "COMMIT=$SOURCE_COMMIT" \
        --build-arg "BUILD_DATE=$BUILD_DATE" \
        --provenance=mode=max \
        --sbom=true \
        --metadata-file "$metadata_file" \
        "$context_path"
      digest="$(jq -r '."containerimage.digest"' "$metadata_file")"
      if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
        echo "Docker buildx did not return a valid $image_name digest" >&2
        exit 1
      fi
      printf '%s\n' "$digest" >"dist/digests/${image_name}.digest"
      echo "published_image=$REGISTRY/$image_name@$digest"
      IMAGE_SCRIPT
      chmod +x dist/release/publish-release-image.sh

      if [[ "$SHOULD_RELEASE" != "true" ]]; then
        echo "Release v$VERSION already exists; skipping base image publication"
        exit 0
      fi
      if [[ -z "${NOPSAI_RELEASE_GHCR_TOKEN:-}" ]]; then
        echo "NOPSAI_RELEASE_GHCR_TOKEN is required to publish container images" >&2
        exit 1
      fi

      printf '%s' "$NOPSAI_RELEASE_GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      if [[ "${NOPSAI_RELEASE_ENABLE_QEMU:-true}" == "true" && "$PLATFORMS" == *","* ]]; then
        docker run --privileged --rm tonistiigi/binfmt --install all
      fi

      builder_suffix="$(printf '%s-nopsai-base-%s' "$VERSION" "$$" | tr -c 'A-Za-z0-9_.-' '-')"
      builder="${NOPSAI_RELEASE_BUILDX_NAME:-nopsai-release-builder}-${builder_suffix}"
      if ! docker buildx inspect "$builder" >/dev/null 2>&1; then
        docker buildx create --name "$builder" --driver docker-container --use
      else
        docker buildx use "$builder"
      fi
      trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
      docker buildx inspect --bootstrap

      rm -rf dist/digests dist/docker-metadata
      mkdir -p dist/digests dist/docker-metadata

      docker buildx build \
        --file Dockerfile \
        --platform "$PLATFORMS" \
        --push \
        --tag "$REGISTRY/nopsai-base:$VERSION" \
        --build-arg "VERSION=$VERSION" \
        --build-arg "COMMIT=$SOURCE_COMMIT" \
        --build-arg "BUILD_DATE=$BUILD_DATE" \
        --provenance=mode=max \
        --sbom=true \
        --metadata-file dist/docker-metadata/nopsai-base.json \
        .
      base_digest="$(jq -r '."containerimage.digest"' dist/docker-metadata/nopsai-base.json)"
      if [[ ! "$base_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
        echo "Docker buildx did not return a valid nopsai-base digest" >&2
        exit 1
      fi
      printf '%s\n' "$base_digest" >dist/digests/nopsai-base.digest
      echo "published_image=$REGISTRY/nopsai-base@$base_digest"
      BASH

  - name: publish-image-nopsai-api
    image: docker:27-cli
    depends_on:
      - publish-base-image
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash dist/release/publish-release-image.sh nopsai-api . container/Dockerfile.nopsai

  - name: publish-image-nopsai-aaa
    image: docker:27-cli
    depends_on:
      - publish-base-image
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash dist/release/publish-release-image.sh nopsai-aaa . container/Dockerfile.aaa

  - name: publish-image-nopsai-agent
    image: docker:27-cli
    depends_on:
      - publish-base-image
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash dist/release/publish-release-image.sh nopsai-agent . container/Dockerfile.agent

  - name: publish-image-nopsai-dispatcher
    image: docker:27-cli
    depends_on:
      - publish-base-image
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash dist/release/publish-release-image.sh nopsai-dispatcher . container/Dockerfile.dispatcher

  - name: publish-image-nopsai-git-bot
    image: docker:27-cli
    depends_on:
      - publish-base-image
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash dist/release/publish-release-image.sh nopsai-git-bot . container/Dockerfile.git-bot

  - name: publish-image-nopsai-docker-runner
    image: docker:27-cli
    depends_on:
      - publish-base-image
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash dist/release/publish-release-image.sh nopsai-docker-runner . container/Dockerfile.docker-runner

  - name: publish-image-nopsai-k8s-runner
    image: docker:27-cli
    depends_on:
      - publish-base-image
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash dist/release/publish-release-image.sh nopsai-k8s-runner . container/Dockerfile.k8s-runner

  - name: publish-image-nopsai-docker-socket-proxy
    image: docker:27-cli
    depends_on:
      - publish-base-image
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash dist/release/publish-release-image.sh nopsai-docker-socket-proxy . container/Dockerfile.socket-proxy

  - name: publish-image-nopsai-ui
    image: docker:27-cli
    depends_on:
      - publish-base-image
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash dist/release/publish-release-image.sh nopsai-ui services/ui services/ui/Dockerfile

  - name: publish-image-pipeline-image
    image: docker:27-cli
    depends_on:
      - publish-base-image
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash docker-cli-buildx jq
      bash dist/release/publish-release-image.sh pipeline-image . container/Dockerfile.pipeline

  - name: publish-images
    image: alpine:3.20
    depends_on:
      - publish-image-nopsai-api
      - publish-image-nopsai-aaa
      - publish-image-nopsai-agent
      - publish-image-nopsai-dispatcher
      - publish-image-nopsai-git-bot
      - publish-image-nopsai-docker-runner
      - publish-image-nopsai-k8s-runner
      - publish-image-nopsai-docker-socket-proxy
      - publish-image-nopsai-ui
      - publish-image-pipeline-image
    script: |
      set -eu
      apk add --no-cache bash
      bash <<'BASH'
      set -euo pipefail

      . dist/release/env
      if [[ "$SHOULD_RELEASE" != "true" ]]; then
        echo "Release v$VERSION already exists; skipping image digest verification"
        exit 0
      fi

      image_names=(
        nopsai-base
        nopsai-api
        nopsai-aaa
        nopsai-agent
        nopsai-dispatcher
        nopsai-git-bot
        nopsai-docker-runner
        nopsai-k8s-runner
        nopsai-docker-socket-proxy
        nopsai-ui
        pipeline-image
      )

      for image_name in "${image_names[@]}"; do
        digest_file="dist/digests/${image_name}.digest"
        if [[ ! -s "$digest_file" ]]; then
          echo "Missing digest file for $image_name" >&2
          exit 1
        fi
        digest="$(tr -d '\r\n' <"$digest_file")"
        if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "Invalid digest for $image_name: $digest" >&2
          exit 1
        fi
        echo "verified_image=$REGISTRY/$image_name@$digest"
      done
      BASH

  - name: package-helm-chart
    image: alpine:3.20
    depends_on:
      - publish-images
    script: |
      set -eu
      apk add --no-cache bash curl git ruby tar gzip
      bash <<'BASH'
      set -euo pipefail
      RELEASE_PHASE=package-helm-chart
      trap 'status=$?; echo "release_phase=${RELEASE_PHASE:-unknown} failed line=$LINENO command=$BASH_COMMAND exit_code=$status" >&2; exit $status' ERR

      install_helm() {
        if command -v helm >/dev/null 2>&1; then
          return
        fi
        local version="${NOPSAI_RELEASE_HELM_VERSION:-3.17.3}"
        local arch
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "Unsupported Helm install architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        curl -fsSL "https://get.helm.sh/helm-v${version}-linux-${arch}.tar.gz" -o /tmp/helm.tgz
        tar -C /tmp -xzf /tmp/helm.tgz
        mv "/tmp/linux-${arch}/helm" /usr/local/bin/helm
        chmod +x /usr/local/bin/helm
      }

      . dist/release/env
      if [[ "$SHOULD_RELEASE" != "true" ]]; then
        echo "Release v$VERSION already exists; skipping Helm chart packaging"
        exit 0
      fi

      install_helm

      echo "release_phase=package-helm-chart"
      rm -rf dist/release/chart
      mkdir -p dist/release
      cp -R deploy/helm/nopsai dist/release/chart
      ruby -ryaml -e '
        path = "dist/release/chart/Chart.yaml"
        version = ARGV.fetch(0)
        chart = YAML.load_file(path)
        chart["version"] = version
        chart["appVersion"] = version
        File.write(path, chart.to_yaml)
      ' "$VERSION"
      helm lint dist/release/chart
      helm package dist/release/chart --destination dist/release
      scripts/generate-changelog.sh "$VERSION" dist/release/CHANGELOG.md "$SOURCE_COMMIT"

      rm -rf dist/assets
      mkdir -p dist/assets
      echo "release_phase=package-helm-chart complete"
      BASH

  - name: publish-helm-chart
    image: alpine:3.20
    depends_on:
      - package-helm-chart
    secrets:
      - NOPSAI_RELEASE_GHCR_TOKEN
    script: |
      set -eu
      apk add --no-cache bash curl tar gzip
      bash <<'BASH'
      set -euo pipefail
      RELEASE_PHASE=publish-helm-chart
      trap 'status=$?; echo "release_phase=${RELEASE_PHASE:-unknown} failed line=$LINENO command=$BASH_COMMAND exit_code=$status" >&2; exit $status' ERR

      install_helm() {
        if command -v helm >/dev/null 2>&1; then
          return
        fi
        local version="${NOPSAI_RELEASE_HELM_VERSION:-3.17.3}"
        local arch
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "Unsupported Helm install architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        curl -fsSL "https://get.helm.sh/helm-v${version}-linux-${arch}.tar.gz" -o /tmp/helm.tgz
        tar -C /tmp -xzf /tmp/helm.tgz
        mv "/tmp/linux-${arch}/helm" /usr/local/bin/helm
        chmod +x /usr/local/bin/helm
      }

      . dist/release/env
      if [[ "$SHOULD_RELEASE" != "true" ]]; then
        echo "Release v$VERSION already exists; skipping Helm chart publication"
        exit 0
      fi
      if [[ -z "${NOPSAI_RELEASE_GHCR_TOKEN:-}" ]]; then
        echo "NOPSAI_RELEASE_GHCR_TOKEN is required to publish the Helm chart to GHCR" >&2
        exit 1
      fi

      install_helm
      echo "release_phase=publish-helm-chart"
      printf '%s' "$NOPSAI_RELEASE_GHCR_TOKEN" | helm registry login ghcr.io \
        --username "$GHCR_USERNAME" \
        --password-stdin
      chart_repository="oci://ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/charts"
      chart_reference="$chart_repository/nopsai"
      chart_push_output="$(helm push "dist/release/nopsai-$VERSION.tgz" "$chart_repository" 2>&1)"
      printf '%s\n' "$chart_push_output"
      chart_digest="$(printf '%s\n' "$chart_push_output" | tr -d '\r' | grep -Eo 'sha256:[a-f0-9]{64}' | tail -1 || true)"
      if [[ ! "$chart_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
        echo "Helm did not return a valid OCI chart digest in push output:" >&2
        printf '%s\n' "$chart_push_output" >&2
        exit 1
      fi
      printf '%s\n' "$chart_reference@$chart_digest" >dist/release/helm-chart.digest
      echo "release_phase=publish-helm-chart complete"
      BASH

  - name: build-cli-archives
    image: golang:1.26.5-alpine
    depends_on:
      - publish-helm-chart
    script: |
      set -eu
      apk add --no-cache bash git tar gzip zip
      bash <<'BASH'
      set -euo pipefail

      . dist/release/env
      if [[ "$SHOULD_RELEASE" != "true" ]]; then
        echo "Release v$VERSION already exists; skipping CLI archive build"
        exit 0
      fi

      rm -rf dist/cli
      mkdir -p dist/cli
      capabilities="api.v1,cli.api-catalog.v1,config-sync.v1,mcp.v1,monitoring.v1,platform.docker-compose,platform.helm,runner.docker,runner.kubernetes"
      ldflags="-s -w -X nopsai/pkg/buildinfo.Version=${VERSION} -X nopsai/pkg/buildinfo.Commit=${SOURCE_COMMIT} -X nopsai/pkg/buildinfo.BuildDate=${BUILD_DATE} -X nopsai/pkg/buildinfo.APIVersion=v1 -X nopsai/pkg/buildinfo.RunnerProtocolVersion=1 -X nopsai/pkg/buildinfo.CLICompatibility=>=2.0.0,<3.0.0 -X nopsai/pkg/buildinfo.RunnerCompatibility=>=2.0.0,<3.0.0 -X nopsai/pkg/buildinfo.PlatformCompatibility=>=2.0.0,<3.0.0 -X nopsai/pkg/buildinfo.Capabilities=${capabilities}"

      for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
        goos="${target%/*}"
        goarch="${target#*/}"
        package_dir="dist/package/${goos}-${goarch}"
        rm -rf "$package_dir"
        mkdir -p "$package_dir"
        binary=nopsai
        if [[ "$goos" == "windows" ]]; then
          binary=nopsai.exe
        fi
        echo "Building CLI for ${goos}/${goarch}"
        CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="$ldflags" -o "$package_dir/$binary" ./cmd/nopsai-cli
        asset="nopsai-cli_${VERSION}_${goos}_${goarch}"
        if [[ "$goos" == "windows" ]]; then
          (cd "$package_dir" && zip -9 "../../cli/${asset}.zip" "$binary")
        else
          tar -C "$package_dir" -czf "dist/cli/${asset}.tar.gz" "$binary"
        fi
      done

      shopt -s nullglob
      cli_assets=(dist/cli/*)
      if (( ${#cli_assets[@]} == 0 )); then
        echo "No CLI release artifacts were built into dist/cli" >&2
        exit 1
      fi
      BASH

  - name: package-release-assets
    image: alpine:3.20
    depends_on:
      - build-cli-archives
      - publish-helm-chart
    script: |
      set -eu
      apk add --no-cache bash coreutils perl-utils tar gzip
      bash <<'BASH'
      set -euo pipefail
      RELEASE_PHASE=package-release-assets
      trap 'status=$?; echo "release_phase=${RELEASE_PHASE:-unknown} failed line=$LINENO command=$BASH_COMMAND exit_code=$status" >&2; exit $status' ERR

      . dist/release/env
      if [[ "$SHOULD_RELEASE" != "true" ]]; then
        echo "Release v$VERSION already exists; skipping release asset packaging"
        exit 0
      fi

      echo "release_phase=package-release-assets"
      helm_chart_asset="nopsai-helm-chart-$VERSION.tgz"
      changelog_asset="nopsai-changelog-$VERSION.md"
      shopt -s nullglob
      cli_assets=(dist/cli/*)
      if (( ${#cli_assets[@]} == 0 )); then
        echo "No CLI release artifacts were built into dist/cli" >&2
        exit 1
      fi
      cp "${cli_assets[@]}" dist/assets/
      cp dist/release/CHANGELOG.md "dist/assets/$changelog_asset"
      cp "dist/release/nopsai-$VERSION.tgz" "dist/assets/$helm_chart_asset"
      (
        cd dist/assets
        find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 >SHA256SUMS
      )
      echo "release_phase=package-release-assets complete"
      BASH

  - name: publish-release
    image: alpine:3.20
    depends_on:
      - package-release-assets
    secrets:
      - NOPSAI_RELEASE_GITHUB_TOKEN
    script: |
      set -eu
      apk add --no-cache bash curl tar gzip
      bash <<'BASH'
      set -euo pipefail
      RELEASE_PHASE=publish-github-release
      trap 'status=$?; echo "release_phase=${RELEASE_PHASE:-unknown} failed line=$LINENO command=$BASH_COMMAND exit_code=$status" >&2; exit $status' ERR

      install_gh() {
        if command -v gh >/dev/null 2>&1; then
          return
        fi
        local version="${NOPSAI_RELEASE_GH_VERSION:-2.74.2}"
        local arch
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "Unsupported GitHub CLI install architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        curl -fsSL "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_${arch}.tar.gz" -o /tmp/gh.tgz
        tar -C /tmp -xzf /tmp/gh.tgz
        mv "/tmp/gh_${version}_linux_${arch}/bin/gh" /usr/local/bin/gh
        chmod +x /usr/local/bin/gh
      }

      . dist/release/env
      if [[ "$SHOULD_RELEASE" != "true" ]]; then
        echo "Release v$VERSION already exists; skipping GitHub release publication"
        exit 0
      fi
      if [[ -z "${NOPSAI_RELEASE_GITHUB_TOKEN:-}" ]]; then
        echo "NOPSAI_RELEASE_GITHUB_TOKEN is required to publish GitHub release assets" >&2
        exit 1
      fi

      install_gh
      export GH_TOKEN="$NOPSAI_RELEASE_GITHUB_TOKEN"
      echo "release_phase=publish-github-release"
      legacy_assets=(
        CHANGELOG.md
        "nopsai-$VERSION.tgz"
        "nopsai_${VERSION}_linux_amd64.tar.gz"
        "nopsai_${VERSION}_linux_arm64.tar.gz"
        "nopsai_${VERSION}_darwin_amd64.tar.gz"
        "nopsai_${VERSION}_darwin_arm64.tar.gz"
        "nopsai_${VERSION}_windows_amd64.zip"
      )
      if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
        if [[ "$ALLOW_EXISTING_RELEASE" != "true" ]]; then
          echo "Release v$VERSION already exists and recovery mode is disabled" >&2
          exit 1
        fi
        echo "github_release_action=update"
        for asset in "${legacy_assets[@]}"; do
          gh release delete-asset "v$VERSION" "$asset" --repo "$GITHUB_REPOSITORY" -y >/dev/null 2>&1 || true
        done
        gh release upload "v$VERSION" dist/assets/* --repo "$GITHUB_REPOSITORY" --clobber
        gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "NopsAI $VERSION" --notes-file dist/release/CHANGELOG.md
      else
        echo "github_release_action=create"
        gh release create "v$VERSION" dist/assets/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title "NopsAI $VERSION" --notes-file dist/release/CHANGELOG.md
      fi
      echo "release_phase=publish-github-release complete"
      BASH
