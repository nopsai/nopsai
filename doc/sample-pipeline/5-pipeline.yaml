name: pipeline5th
description: A simple MCP-enabled sample pipeline for repository review, dependency notes, and deployment readiness.
llm_content_sharing: true
llm_content_include:
  - "test-app/README.md"
  - "test-app/Dockerfile"
  - "test-app/docker-compose.yml"
llm_content_ignore:
  - ".git"
  - "node_modules"
  - "vendor"
llm_output_sharing: true
llm_profile: reasoning
# MCP profiles are approved in System > MCP or a system GitOps file such as
# setting/system/mcp.yaml. Pipelines only reference profiles; they do not define servers.
mcp_profiles:
  - github-readonly
knowledge_context:
  - kind: guardrail
    ref: security/repo-check
    required: true
  - kind: architecture
    path: .nopsai/docs/backend.md
display_options:
  github_view: "mermaid" # mermaid, tree or flat
container_image: "hoseindocker/pipeline-image:latest"
working_directory: "/tmp/pipeline5th"
timeout: "15m"
variables:
  - DOCKER_HOST
  - API_VERSION
  - TEST_SCOPE
steps:
  - name: clone-repository
    image: hoseindocker/pipeline-image:latest
    secrets:
      - TEST_SECRET
    script: |
      #!/bin/bash
      set -euo pipefail
      git clone https://github.com/hosein-yousefii/test-app.git
      cd test-app
      git status --short
      git rev-parse --short HEAD

  - name: repository-map
    goal: >-
      Use the approved GitHub MCP tools to read repository metadata and the shared workspace files.
      Summarize the project purpose, important files, default branch, latest commit, and any obvious missing docs.
    mcp_profiles:
      - github-readonly
    depends_on:
      - clone-repository

  - name: dependency-and-docs-check
    goal: >-
      Check the application dependencies and public documentation for the main runtime and build tools.
      Return a short list of upgrade notes, compatibility warnings, and documentation links that are useful for this repo.
    mcp_profiles:
      - dependency-intel
      - docs-search
    depends_on:
      - repository-map

  - name: container-readiness
    goal: >-
      Review Dockerfile and docker-compose.yml from the workspace. Suggest the smallest safe changes for image size,
      health checks, required environment variables, and local run instructions. Do not modify files.
    mcp_profiles:
      - github-readonly
      - docs-search
    depends_on:
      - clone-repository

  - name: cluster-readiness-notes
    goal: >-
      Use the read-only Kubernetes MCP profile to identify deployment checklist items only.
      Do not change cluster resources. Return namespaces, workloads, config gaps, and safe next commands.
    mcp_profiles:
      - kubernetes-readonly
    depends_on:
      - container-readiness

  - name: final-mcp-report
    goal: >-
      Create a concise report that combines repository-map, dependency-and-docs-check,
      container-readiness, and cluster-readiness-notes. Include next actions grouped by quick wins and follow-ups.
    depends_on:
      - dependency-and-docs-check
      - cluster-readiness-notes
