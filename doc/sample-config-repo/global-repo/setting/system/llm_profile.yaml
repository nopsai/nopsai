default_profile: standard

profiles:
  - name: fast
    provider: gemini
    model: gemini-2.5-flash
    credential_ref: credential://system/llm/gemini-fast
    allowed_scopes: ["dev", "prod"]

  - name: reasoning
    provider: lmstudio
    model: google/gemma-4-26b-a4b
    base_url: http://lmstudio:1234
    reasoning: high
    allowed_scopes: ["dev"]

  - name: standard
    provider: lmstudio
    model: google/gemma-4-e4b
    base_url: http://lmstudio:1234
    reasoning: off

  - name: hosted
    provider: openai
    model: gpt-4.1-mini
    credential_ref: credential://system/llm/openai-hosted
    timeout_seconds: 60
    max_tokens: 4096
    allowed_scopes: ["dev", "prod"]

  - name: claude-review
    provider: anthropic
    model: claude-sonnet-4-6
    credential_ref: credential://system/llm/anthropic-review
    max_tokens: 4096
    allowed_scopes: ["prod"]

  - name: local-ollama
    provider: ollama
    model: qwen2.5-coder:14b
    base_url: http://ollama:11434/v1
    allowed_scopes: ["dev"]

  - name: routed
    provider: openrouter
    model: openai/gpt-4.1-mini
    credential_ref: credential://system/llm/openrouter-routed
    extra:
      http_referer: https://nopsai.example.com
      x_title: NopsAI
    allowed_scopes: ["dev", "prod"]
