users:
  - sub: alice
    email: alice@example.com
    status: active

  - sub: bob
    email: bob@example.com
    status: active
    advanced_roles:
      - viewer

advanced_roles:
  - name: release-manager
    description: Can run and inspect release pipelines.
    policies:
      - name: Run release pipelines
        resource: pipeline:team-1/*
        action: pipeline.execute
      - name: Read release runs
        resource: pipeline_run:*
        action: pipeline_run.read

basic_roles:
  - user: alice
    role: owner
    resource: team:team-1
