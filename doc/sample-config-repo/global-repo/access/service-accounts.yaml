service_accounts:
  - sub: webhook-deployer
    email: webhook-deployer@example.com
    status: active

  - sub: servicenow-prod
    email: servicenow-prod@example.com
    status: active
    advanced_roles:
      - servicenow-prod-external-trigger-runner

advanced_roles:
  - name: servicenow-prod-external-trigger-runner
    description: Least-privilege ServiceNow production deployment trigger runner.
    policies:
      - name: Invoke deploy-prod external trigger
        resource: external_trigger:deploy-prod
        action: external_trigger.invoke
      - name: Execute platform maintenance pipeline
        resource: pipeline:platform-maintenance
        action: pipeline.execute
      - name: Use platform maintenance pipeline
        resource: pipeline:platform-maintenance
        action: pipeline.use

basic_roles:
  - service_account: webhook-deployer
    role: developer
    resource: pipeline:platform-maintenance

  - service_account: webhook-deployer
    role: developer
    resource: scope:dev

  - service_account: webhook-deployer
    role: viewer
    resource: trigger:acme/deploy-webhook
