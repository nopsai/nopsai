service_accounts:
  - sub: webhook-deployer
    email: webhook-deployer@example.com
    status: active

basic_roles:
  - service_account: webhook-deployer
    role: developer
    resource: pipeline:platform-maintenance

  - service_account: webhook-deployer
    role: developer
    resource: scope:dev

  - service_account: webhook-deployer
    role: viewer
    resource: trigger:acme/deploy-webhook
