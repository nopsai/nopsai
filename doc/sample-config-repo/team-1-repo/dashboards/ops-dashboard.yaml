title: Ops Dashboard
description: Team 1 operational dashboard populated by pipeline final outputs.
visibility: team
sections:
  - section_key: service-metrics
    title: Service Metrics
    description: Current service health and metric summaries produced by dashboard pipelines.
    display_order: 10
  - section_key: image-builds
    title: Image Builds
    description: Image inventory, duration metrics, and build summaries from dashboard output samples.
    display_order: 20
  - section_key: release-readiness
    title: Release Readiness
    description: Production readiness, release reports, and image comparisons.
    display_order: 30
  - section_key: build-timeline
    title: Build Timeline
    description: Chronological build history and series-oriented dashboard publications.
    display_order: 40
  - section_key: operations-digest
    title: Operations Digest
    description: Mixed dashboard output combining summary, metrics, risks, and actions.
    display_order: 50
sources:
  - section_key: service-metrics
    pipeline_id: team-1/dashboard-sample
    output_name: Service metrics
    entry_key: dashboard-sample
    enabled: true
    required_for_refresh: true
    refresh_order: 10
  - section_key: image-builds
    pipeline_id: team-1/dashboard-multi-output-sample
    output_name: Image build summary
    entry_key: image-build-summary
    enabled: true
    required_for_refresh: true
    refresh_order: 20
  - section_key: image-builds
    pipeline_id: team-1/dashboard-multi-output-sample
    output_name: Image inventory table
    entry_key: image-inventory-table
    enabled: true
    required_for_refresh: false
    refresh_order: 21
  - section_key: image-builds
    pipeline_id: team-1/dashboard-multi-output-sample
    output_name: Build duration metrics
    entry_key: build-duration-metrics
    enabled: true
    required_for_refresh: false
    refresh_order: 22
  - section_key: release-readiness
    pipeline_id: team-1/dashboard-multi-output-sample
    output_name: Production readiness status
    entry_key: production-readiness-status
    enabled: true
    required_for_refresh: true
    refresh_order: 30
  - section_key: release-readiness
    pipeline_id: team-1/dashboard-multi-output-sample
    output_name: Image comparison
    entry_key: image-comparison
    enabled: true
    required_for_refresh: false
    refresh_order: 31
  - section_key: release-readiness
    pipeline_id: team-1/dashboard-multi-output-sample
    output_name: Release report
    entry_key: release-report
    enabled: true
    required_for_refresh: false
    refresh_order: 32
  - section_key: build-timeline
    pipeline_id: team-1/dashboard-multi-output-sample
    output_name: Build timeline
    entry_key: build-timeline
    enabled: true
    required_for_refresh: false
    refresh_order: 40
  - section_key: operations-digest
    pipeline_id: team-1/dashboard-multi-output-sample
    output_name: Mixed operations digest
    entry_key: mixed-operations-digest
    enabled: true
    required_for_refresh: false
    refresh_order: 50
