title: Ops Dashboard
description: Team 1 operational dashboard populated by pipeline final outputs.
visibility: team
sections:
  - section_key: service-metrics
    title: Service Metrics
    description: Current service health and metric summaries produced by dashboard pipelines.
    display_order: 10
  - section_key: technical-readiness
    title: Technical Readiness
    description: API release readiness and monitoring evidence from executable technical pipelines.
    display_order: 15
  - section_key: image-builds
    title: Image Builds
    description: Image inventory, duration metrics, and build summaries from dashboard output samples.
    display_order: 20
  - section_key: release-readiness
    title: Release Readiness
    description: Production readiness, release reports, and image comparisons.
    display_order: 30
  - section_key: build-timeline
    title: Build Timeline
    description: Chronological build history and series-oriented dashboard publications.
    display_order: 40
  - section_key: operations-digest
    title: Operations Digest
    description: Mixed dashboard output combining summary, metrics, risks, and actions.
    display_order: 50
  - section_key: customer-success
    title: Customer Success
    description: Business-facing customer onboarding health and follow-up actions.
    display_order: 60
  - section_key: finance-operations
    title: Finance Operations
    description: Month-end close status, cash position, aging, and finance blockers.
    display_order: 70
  - section_key: people-operations
    title: People Operations
    description: Capacity planning and staffing demand comparisons.
    display_order: 80
sources:
  - section_key: service-metrics
    pipeline_id: team-1/dashboard-sample
    output_name: Service metrics
    entry_key: dashboard-sample
    enabled: true
    required_for_refresh: true
    refresh_order: 10
