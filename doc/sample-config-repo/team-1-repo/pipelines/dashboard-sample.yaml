name: dashboard-sample
version: "1.0.0"
description: Generate service metric evidence and publish it to the Team 1 ops dashboard.
container_image: alpine:3.20
working_directory: /workspace
timeout: 10m
output:
  items:
    - name: Service metrics
      type: dashboard
      when: success
      dashboard:
        ref: team-1/ops-dashboard
        section: service-metrics
        entry_key: dashboard-sample
        mode: replace
        preset: auto
        ttl: 24h
      prompt: |
        Publish the service metrics from the JSON run evidence to the ops dashboard.
        Show the current service health, request and error counts, p95 latency,
        task durations, and the most important follow-up.
        If a visualization is not specified, choose the best dashboard structure
        for the evidence instead of forcing one format.
steps:
  - name: collect-service-metrics
    script: |
      #!/bin/sh
      set -e
      echo "Collecting service metrics for dashboard-sample"
      cat <<'JSON'
      {"service":"checkout-api","window":"last_15m","status":"success","requests_total":1250,"requests_success":1240,"errors":10,"p95_latency_ms":182,"slo_p95_latency_ms":250,"task_durations_seconds":[{"task":"collect","duration":12},{"task":"validate","duration":8},{"task":"publish","duration":5}],"follow_up":"Keep watching error rate during the next deploy window."}
      JSON

  - name: validate-metrics
    script: |
      #!/bin/sh
      set -e
      echo "Validated service metric evidence for dashboard publication"
    depends_on:
      - collect-service-metrics
