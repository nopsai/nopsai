name: variable-feature-exercise
version: "1.0.0"
description: Exercises scope variables, static precedence, include variables, and runtime task outputs.
container_image: alpine:3.20
working_directory: /workspace
timeout: 10m
llm_enabled: false
display_options:
  github_view: mermaid
variables:
  - API_VERSION
  - DEPLOY_TARGET
  - default:GLOBAL_REGION
  - team-1/prod:REGISTRY
  - team-1/dev:RELEASE_CHANNEL
steps:
  - name: collect-runtime-values
    variables:
      DEPLOY_TARGET: step-overridden-target
      STEP_ONLY: from-step-variable
    tasks:
      - name: produce
        variables:
          DEPLOY_TARGET: task-overridden-target
          TASK_ONLY: from-task-variable
        outputs:
          - release_manifest
          - image_tag
          - IMAGE_TAG
          - task_target
          - name: access_token
            sensitive: true
        script: |
          #!/bin/sh
          set -eu
          printf 'api=%s target=%s region=%s registry=%s channel=%s step=%s task=%s' \
            "$API_VERSION" \
            "$DEPLOY_TARGET" \
            "$GLOBAL_REGION" \
            "$REGISTRY" \
            "$RELEASE_CHANNEL" \
            "$STEP_ONLY" \
            "$TASK_ONLY" > /nopsai/outputs/release_manifest
          printf '%s' "${REGISTRY}/variable-feature:${API_VERSION}-${RELEASE_CHANNEL}" > /nopsai/outputs/image_tag
          printf '%s' "${REGISTRY}/variable-feature:UPPER-${API_VERSION}" > /nopsai/outputs/IMAGE_TAG
          printf '%s' "$DEPLOY_TARGET" > /nopsai/outputs/task_target
          printf '%s' "token-${API_VERSION}-${RELEASE_CHANNEL}" > /nopsai/outputs/access_token

      - name: consume
        depends_on:
          - produce
        variables:
          RELEASE_MANIFEST: $steps.collect-runtime-values.produce.outputs.release_manifest
          IMAGE_TAG_LOWER: $steps.collect-runtime-values.produce.outputs.image_tag
          IMAGE_TAG_UPPER: $steps.collect-runtime-values.produce.outputs.IMAGE_TAG
          TASK_TARGET: $steps.collect-runtime-values.produce.outputs.task_target
          ACCESS_TOKEN: $steps.collect-runtime-values.produce.outputs.access_token
        script: |
          #!/bin/sh
          set -eu
          test "$DEPLOY_TARGET" = "step-overridden-target"
          test "$TASK_TARGET" = "task-overridden-target"
          test "$STEP_ONLY" = "from-step-variable"
          test -n "$RELEASE_MANIFEST"
          test "$IMAGE_TAG_LOWER" != "$IMAGE_TAG_UPPER"
          test -n "$ACCESS_TOKEN"
          printf 'consumer saw lower=%s upper=%s\n' "$IMAGE_TAG_LOWER" "$IMAGE_TAG_UPPER"

  - name: reusable-step-variable-merge
    include: step:team-1/shared/variable-defaults
    depends_on:
      - collect-runtime-values.produce
    variables:
      REUSABLE_MODE: include-overrode-mode
      RELEASE_MANIFEST: $steps.collect-runtime-values.produce.outputs.release_manifest

  - name: child-pipeline-variable-overrides
    include: pipeline:variable-feature-child
    sync: true
    depends_on:
      - collect-runtime-values.produce
      - reusable-step-variable-merge
    variables:
      CHILD_RELEASE_MANIFEST: $steps.collect-runtime-values.produce.outputs.release_manifest
      CHILD_IMAGE_TAG: $steps.collect-runtime-values.produce.outputs.image_tag
      CHILD_ACCESS_TOKEN: $steps.collect-runtime-values.produce.outputs.access_token
      CHILD_LITERAL: literal-from-parent-include

  - name: final-variable-audit
    depends_on:
      - collect-runtime-values.consume
      - reusable-step-variable-merge
      - child-pipeline-variable-overrides
    script: |
      #!/bin/sh
      set -eu
      printf 'variable feature exercise completed for %s in %s\n' "$API_VERSION" "$GLOBAL_REGION"
