name: dashboard-sample
version: "1.0.0"
description: Generates multiple dashboard outputs for one dashboard to exercise publication modes, presets, charts, and status renderers.
container_image: python:3.11-slim
working_directory: /workspace
timeout: 10m
output:
  llm_profile: reasoning
  items:
    - name: Image build summary
      type: dashboard
      when: always
      dashboard:
        ref: team-1/ops-dashboard
        section: image-builds
        entry_key: image-build-summary
        mode: replace
        preset: auto
        ttl: 7d
      prompt: |
        Show how many images were built, which version each image used, how long
        each image build took, and the most important subject in this pipeline.
        Treat the dog and car sentence as noise.

    - name: Image inventory table
      type: dashboard
      when: always
      dashboard:
        ref: team-1/ops-dashboard
        section: image-builds
        entry_key: image-inventory-table
        mode: append
        preset: table
        ttl: 7d
      prompt: |
        Create a table of every image, tag, environment, build duration, and
        production readiness note. Include vulnerability and missing environment
        observations as columns.

    - name: Production readiness status
      type: dashboard
      when: always
      dashboard:
        ref: team-1/ops-dashboard
        section: release-readiness
        entry_key: production-readiness-status
        mode: replace
        preset: status
        ttl: 7d
      prompt: |
        Summarize production readiness. Make clear that the vulnerable images
        must not run in production and that missing environment configuration can
        make runtime execution fail.

    - name: Build duration metrics
      type: dashboard
      when: always
      dashboard:
        ref: team-1/ops-dashboard
        section: image-builds
        entry_key: build-duration-metrics
        mode: series
        preset: metrics
        ttl: 14d
      prompt: |
        Publish numeric build duration metrics for each image. Show total build
        time, average build time, fastest image, slowest image, and a chart-ready
        breakdown by image. Because this output publishes with mode: series,
        include at least one chart or series block with build duration points.

    - name: Build timeline
      type: dashboard
      when: always
      dashboard:
        ref: team-1/ops-dashboard
        section: build-timeline
        entry_key: build-timeline
        mode: series
        preset: timeline
        ttl: 14d
      prompt: |
        Show a chronological build timeline using the step evidence. Because
        this output publishes with mode: series, include at least one line or
        area chart or series block with ordered duration points for each image.
        Use the image order from the emitted logs and JSON evidence.

    - name: Image comparison
      type: dashboard
      when: always
      dashboard:
        ref: team-1/ops-dashboard
        section: release-readiness
        entry_key: image-comparison
        mode: snapshot
        preset: comparison
        ttl: 14d
      prompt: |
        Compare the four images side by side by tag, environment, duration,
        production readiness, vulnerability state, and missing runtime
        configuration.

    - name: Readiness donut chart
      type: dashboard
      when: always
      dashboard:
        ref: team-1/ops-dashboard
        section: release-readiness
        entry_key: readiness-donut-chart
        mode: replace
        preset: metrics
        ttl: 14d
      prompt: |
        Create a compact circular-chart dashboard output from the emitted JSON
        evidence. Include one donut chart for production readiness with points
        for production ready and blocked from production. Include one pie chart
        for runtime configuration coverage with points for missing configuration
        and configuration present. Chart points must use label and numeric value
        only. Add a short risk callout explaining why all production-ready values
        are currently blocked.

    - name: Boolean readiness matrix
      type: dashboard
      when: always
      dashboard:
        ref: team-1/ops-dashboard
        section: release-readiness
        entry_key: boolean-readiness-matrix
        mode: snapshot
        preset: table
        ttl: 14d
      prompt: |
        Create a dashboard table that exercises boolean status rendering. For
        every image, include image name, tag, environment, has vulnerabilities,
        missing environment configuration, production ready, and changelog
        updated. Use boolean values or yes/no values for the boolean columns.
        Include an overall status block that shows production ready is false and
        changelog updated is true.

    - name: Release report
      type: dashboard
      when: always
      dashboard:
        ref: team-1/ops-dashboard
        section: release-readiness
        entry_key: release-report
        mode: append
        preset: report
        ttl: 7d
      prompt: |
        Write a concise release report for dashboard readers. Include what was
        built, what changed in Git, what blocks production usage, and the next
        follow-up action. Structure it as report blocks: executive summary
        first, then built artifacts, Git changes, production blockers, and next
        action. A compact table is acceptable only as supporting evidence after
        the narrative sections; do not make a table the primary layout.

    - name: Mixed operations digest
      type: dashboard
      when: always
      dashboard:
        ref: team-1/ops-dashboard
        section: operations-digest
        entry_key: mixed-operations-digest
        mode: snapshot
        preset: mixed
        ttl: 7d
      prompt: |
        Create one cohesive Docker image operations overview from the emitted
        JSON evidence. Start with KPI cards for images built, total build time
        with average, production ready as ready/total, and runtime
        configuration present as configured/total. Then include a horizontal
        build-duration comparison by image, production-readiness and runtime
        configuration donut charts, a production-blocked risk callout, a
        readiness matrix table, and concise next actions. Mention only
        operational evidence; treat the dog and car sentence as unrelated noise.
steps:
  - name: generate-data
    script: |
      python - <<'PY'
      import json

      images = [
          {
              "name": "nopsai-dashboard",
              "tag": "latest",
              "environment": "dashboard",
              "build_duration_seconds": 24,
              "has_vulnerabilities": True,
              "missing_environment": False,
              "production_ready": False,
          },
          {
              "name": "git-sample",
              "tag": "dev",
              "environment": "development",
              "build_duration_seconds": 55,
              "has_vulnerabilities": True,
              "missing_environment": True,
              "production_ready": False,
          },
          {
              "name": "app-finance",
              "tag": "prod",
              "environment": "production",
              "build_duration_seconds": 60,
              "has_vulnerabilities": True,
              "missing_environment": True,
              "production_ready": False,
          },
          {
              "name": "seed-static",
              "tag": "3.4.5",
              "environment": "static-assets",
              "build_duration_seconds": 12,
              "has_vulnerabilities": True,
              "missing_environment": False,
              "production_ready": False,
          },
      ]

      print("we built 4 different docker images, nopsai-dashboard:latest, git-sample:dev, app-finance:prod, seed-static:3.4.5")
      print("this is how each image took to be built, 24s, 55s, 60s, 12s")
      print("These images have vulnerabilities and can not be run in production")
      print("some environments are not provided for images, so it might fails during running")
      print("git repositories are updated with proper changelog")
      print("my dog name is leone, and I have a car")
      print("dashboard_evidence=" + json.dumps({
          "subject": "docker image build and production readiness",
          "images_built": len(images),
          "images": images,
          "readiness_summary": {
              "production_ready": sum(1 for image in images if image["production_ready"]),
              "blocked_from_production": sum(1 for image in images if not image["production_ready"]),
              "missing_runtime_configuration": sum(1 for image in images if image["missing_environment"]),
              "runtime_configuration_present": sum(1 for image in images if not image["missing_environment"]),
              "vulnerable_images": sum(1 for image in images if image["has_vulnerabilities"]),
          },
          "git_changelog_updated": True,
          "operational_risk": "Images contain vulnerabilities and missing environment configuration can make runtime execution fail.",
          "noise": {
              "dog_name": "leone",
              "car_mentioned": True,
              "operationally_relevant": False,
          },
      }, sort_keys=True))
      PY
