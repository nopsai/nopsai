name: technical-slo-burn-rate
version: "1.0.0"
description: Produces a monitoring-oriented SLO burn-rate snapshot for dashboard series output.
container_image: alpine:3.20
working_directory: /workspace
timeout: 10m
output:
  items:
    - name: SLO burn-rate dashboard
      type: dashboard
      when: success
      dashboard:
        ref: team-1/ops-dashboard
        section: technical-readiness
        entry_key: slo-burn-rate
        mode: series
        preset: metrics
        ttl: 14d
      prompt: |
        Publish monitoring metrics from dashboard_evidence. Because this output
        uses mode: series, include at least one chart or series block with
        ordered burn-rate points. Also show current burn rate, error budget
        remaining, alert policy status, and the recommended owner action.
steps:
  - name: collect-slo-evidence
    script: |
      #!/bin/sh
      set -e
      echo "Collecting SLO burn-rate evidence"
      cat <<'JSON'
      dashboard_evidence={"purpose":"technical_slo_burn_rate","service":"checkout-api","slo_window":"last_30m","slo_target_percent":99.9,"current_burn_rate":0.82,"error_budget_remaining_percent":73.4,"alert_policy":"api-high-burn-rate","alert_state":"ok","series":[{"timestamp":"2026-07-18T08:00:00Z","burn_rate":0.64},{"timestamp":"2026-07-18T08:10:00Z","burn_rate":0.71},{"timestamp":"2026-07-18T08:20:00Z","burn_rate":0.79},{"timestamp":"2026-07-18T08:30:00Z","burn_rate":0.82}],"next_action":"Keep the current alert threshold and review again after the next deploy."}
      JSON

  - name: validate-monitoring-window
    script: |
      #!/bin/sh
      set -e
      echo "SLO monitoring window validated: last_30m"
    depends_on:
      - collect-slo-evidence
