name: customer-onboarding-pulse
version: "1.0.0"
description: Summarizes enterprise customer onboarding progress for a business-facing dashboard.
container_image: alpine:3.20
working_directory: /workspace
timeout: 10m
output:
  items:
    - name: Customer onboarding dashboard
      type: dashboard
      when: success
      dashboard:
        ref: team-1/ops-dashboard
        section: customer-success
        entry_key: enterprise-onboarding
        mode: replace
        preset: mixed
        ttl: 7d
      prompt: |
        Create a customer onboarding dashboard from dashboard_evidence. Start
        with KPI cards for accounts, completed onboarding, at-risk onboarding,
        and average days to launch. Then add a status callout, account table,
        and concise next actions for customer success leadership.
steps:
  - name: collect-onboarding-evidence
    script: |
      #!/bin/sh
      set -e
      echo "Collecting customer onboarding pulse"
      cat <<'JSON'
      dashboard_evidence={"purpose":"customer_onboarding_pulse","reporting_window":"current_week","accounts_total":6,"completed_onboarding":4,"at_risk_onboarding":1,"average_days_to_launch":12,"overall_status":"watch","accounts":[{"account":"Northstar Bank","segment":"enterprise","phase":"security review","status":"watch","owner":"CSM West"},{"account":"Blue Harbor Retail","segment":"enterprise","phase":"training","status":"on_track","owner":"CSM Central"},{"account":"Metro Health Group","segment":"regulated","phase":"data mapping","status":"on_track","owner":"CSM East"},{"account":"Atlas Manufacturing","segment":"enterprise","phase":"go-live","status":"completed","owner":"CSM West"}],"next_actions":["Escalate Northstar Bank security questionnaire owner today.","Confirm Blue Harbor Retail admin training attendance.","Prepare Metro Health Group data mapping sign-off packet."]}
      JSON

  - name: validate-business-summary
    script: |
      #!/bin/sh
      set -e
      echo "Customer onboarding evidence is dashboard-ready"
    depends_on:
      - collect-onboarding-evidence
