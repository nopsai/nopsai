name: build-and-test
version: "1.0.0"
description: Build, test, and package the service application.
container_image: alpine:3.20
working_directory: /workspace
timeout: 15m
display_options:
  github_view: mermaid
access:
  visibility: restricted
  use_access:
    grants:
      - subject_type: repository
        subject_id: hosein-yousefii/test-app
      - subject_type: group
        subject_id: data-team
variables:
  - API_VERSION
  - IMAGE_NAME
knowledge_context:
  - kind: guardrail
    ref: security/repo-check
    required: true
  - kind: architecture
    ref: team-1/backend
    required: true
output:
  items:
    - name: Executive summary
      type: markdown
      when: success
      prompt: |
        Summarize the build-and-test run for engineering leadership.
        Include the result, notable evidence, and recommended next action.
    - name: Test data table
      type: excel
      when: success
      prompt: |
        Create a table with each step, status, key evidence, and recommendation.
    - name: Failure analysis
      type: pdf
      when: failure
      prompt: |
        Explain why the build-and-test run failed.
        Include the failed step, key evidence, risk, and recommended fix.
steps:
  - name: checkout
    include: step:team-1/shared/checkout

  - name: test
    script: |
      #!/bin/sh
      set -e
      echo "Running tests for API_VERSION=$API_VERSION"
      echo "Tests completed"
    depends_on:
      - checkout

  - name: package
    script: |
      #!/bin/sh
      set -e
      echo "Packaging image $IMAGE_NAME"
    depends_on:
      - test

  - name: notify
    include: step:team-1/shared/notify
    depends_on:
      - package
