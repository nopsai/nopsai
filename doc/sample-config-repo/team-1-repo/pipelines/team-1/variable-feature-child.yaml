name: variable-feature-child
version: "1.0.0"
description: Child pipeline used by variable-feature-exercise to verify include variable overrides.
container_image: alpine:3.20
working_directory: /workspace
timeout: 5m
llm_enabled: false
variables:
  - CHILD_RELEASE_MANIFEST
  - CHILD_IMAGE_TAG
  - CHILD_ACCESS_TOKEN
  - CHILD_LITERAL
steps:
  - name: verify-child-variables
    script: |
      #!/bin/sh
      set -eu
      test -n "$CHILD_RELEASE_MANIFEST"
      test -n "$CHILD_IMAGE_TAG"
      test -n "$CHILD_ACCESS_TOKEN"
      test "$CHILD_LITERAL" = "literal-from-parent-include"
      printf 'child received image=%s literal=%s\n' "$CHILD_IMAGE_TAG" "$CHILD_LITERAL"
