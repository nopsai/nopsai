name: people-capacity-plan
version: "1.0.0"
description: Compares staffing capacity and demand for a non-technical operations dashboard.
container_image: alpine:3.20
working_directory: /workspace
timeout: 10m
output:
  items:
    - name: People capacity dashboard
      type: dashboard
      when: success
      dashboard:
        ref: team-1/ops-dashboard
        section: people-operations
        entry_key: capacity-plan
        mode: replace
        preset: comparison
        ttl: 14d
      prompt: |
        Compare planned capacity with forecast demand from dashboard_evidence.
        Use a side-by-side comparison for functions or squads, show the largest
        capacity gaps, and finish with the next staffing action. Keep the tone
        suitable for enterprise people-operations leaders.
steps:
  - name: collect-capacity-evidence
    script: |
      #!/bin/sh
      set -e
      echo "Collecting people capacity plan"
      cat <<'JSON'
      dashboard_evidence={"purpose":"people_capacity_plan","planning_window":"next_4_weeks","overall_status":"watch","functions":[{"function":"Customer Success","planned_fte":8,"forecast_demand_fte":9,"gap_fte":-1,"status":"watch"},{"function":"Implementation","planned_fte":6,"forecast_demand_fte":6,"gap_fte":0,"status":"on_track"},{"function":"Support","planned_fte":10,"forecast_demand_fte":11,"gap_fte":-1,"status":"watch"},{"function":"Enablement","planned_fte":3,"forecast_demand_fte":2,"gap_fte":1,"status":"available"}],"largest_gap":"Customer Success and Support each need one additional FTE-equivalent week.","next_action":"Move one Enablement week into onboarding support coverage."}
      JSON

  - name: validate-capacity-plan
    script: |
      #!/bin/sh
      set -e
      echo "People capacity evidence validated for dashboard comparison"
    depends_on:
      - collect-capacity-evidence
