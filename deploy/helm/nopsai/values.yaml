global:
  releaseVersion: dev
  sourceCommit: unknown
  platformID: ""
  environment: production
  logLevel: info
  logFormat: json
  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}

topology:
  nopsaiAPIURL: http://nopsai:8080
  dispatcherGRPCAddress: dispatcher:9090
  aaaAPIURL: http://aaa:8082
  gitBotAPIURL: http://git-bot:8081
  gotenbergURL: http://gotenberg:3000

bootstrapAdmin:
  email: admin@example.com

secrets:
  existingSecret: nopsai-secrets
  keys:
    databaseURL: database-url
    postgresPassword: postgres-password
    masterKey: master-key
    jwtSigningKey: jwt-signing-key
    serviceJWTSigningKey: service-jwt-signing-key
    aaaSharedInternalToken: aaa-shared-internal-token
    dispatcherTLSSecret: dispatcher-tls-secret
    bootstrapAdminPassword: bootstrap-admin-password

base:
  image: {repository: ghcr.io/nopsai/nopsai-base, tag: dev, digest: ""}

postgres:
  enabled: true
  image: {repository: postgres, tag: "15", digest: ""}
  imagePullPolicy: IfNotPresent
  database: nopsai_db
  username: nopsai_user
  auth:
    existingSecret: ""
    passwordKey: postgres-password
  service:
    name: postgres
    port: 5432
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 20Gi
  initdb:
    enabled: true
  resources: {}

api:
  replicaCount: 1
  image: {repository: ghcr.io/nopsai/nopsai-api, tag: dev, digest: ""}
  imagePullPolicy: IfNotPresent
  metricsRequireAuth: true
  runtimeOutputMaxBytes: 65536
  serviceAccount:
    create: true
    name: nopsai-api
    annotations: {}
  service:
    type: ClusterIP
    port: 8080
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
  resources: {}

aaa:
  replicaCount: 1
  image: {repository: ghcr.io/nopsai/nopsai-aaa, tag: dev, digest: ""}
  imagePullPolicy: IfNotPresent
  service:
    port: 8082
  resources: {}

agent:
  image: {repository: ghcr.io/nopsai/nopsai-agent, tag: dev, digest: ""}

dispatcher:
  replicaCount: 1
  image: {repository: ghcr.io/nopsai/nopsai-dispatcher, tag: dev, digest: ""}
  imagePullPolicy: IfNotPresent
  service:
    port: 9090
  resources: {}

gitBot:
  replicaCount: 1
  image: {repository: ghcr.io/nopsai/nopsai-git-bot, tag: dev, digest: ""}
  imagePullPolicy: IfNotPresent
  service:
    port: 8081
  resources: {}

runner:
  image: {repository: ghcr.io/nopsai/nopsai-docker-runner, tag: dev, digest: ""}

k8sRunner:
  enabled: true
  replicaCount: 1
  image: {repository: ghcr.io/nopsai/nopsai-k8s-runner, tag: dev, digest: ""}
  imagePullPolicy: IfNotPresent
  runnerID: k8s-runner-1
  scopes: ""
  capacity: 10
  serviceID: ""
  serviceAccount:
    create: true
    name: nopsai-runner
    annotations: {}
  workload:
    serviceAccount:
      create: true
      name: nopsai-runner-workload
      annotations: {}
      automountServiceAccountToken: false
    imagePullSecrets: []
  rbac:
    create: true
  workspace:
    size: 10Gi
    accessMode: ReadWriteOnce
    volumeMode: pvc
    existingPVC: ""
    storageClass: ""
  defaultTaskTimeout: 30m
  defaultRunTimeout: 2h
  affinityEnabled: true
  cleanupFinishedPods: true
  resources: {}

systemLogs:
  enabled: true
  provider: kubernetes
  dockerHost: ""
  kubernetes:
    labelSelector: ""
    container: ""
    rbac:
      create: true

ui:
  replicaCount: 1
  image: {repository: ghcr.io/nopsai/nopsai-ui, tag: dev, digest: ""}
  imagePullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}

pipeline:
  image: {repository: ghcr.io/nopsai/pipeline-image, tag: dev, digest: ""}

gotenberg:
  enabled: true
  replicaCount: 1
  image:
    repository: gotenberg/gotenberg
    tag: 8.32.0
    digest: ""
  imagePullPolicy: IfNotPresent
  service:
    port: 3000
  resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nopsai.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
