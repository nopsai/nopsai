{{- if .Values.k8sRunner.enabled }}
{{- $workloadImagePullSecrets := default .Values.global.imagePullSecrets .Values.k8sRunner.workload.imagePullSecrets }}
{{- if .Values.k8sRunner.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nopsai.runnerServiceAccountName" . }}
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-runner
  {{- with .Values.k8sRunner.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}
{{- if .Values.k8sRunner.workload.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nopsai.runnerWorkloadServiceAccountName" . }}
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: pipeline-workload
  {{- with .Values.k8sRunner.workload.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.k8sRunner.workload.serviceAccount.automountServiceAccountToken }}
{{- with $workloadImagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}
{{- if .Values.k8sRunner.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nopsai-k8s-runner
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-runner
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nopsai-k8s-runner
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-runner
subjects:
  - kind: ServiceAccount
    name: {{ include "nopsai.runnerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nopsai-k8s-runner
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nopsai-k8s-runner
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-runner
    nopsai.io/runner-id: {{ .Values.k8sRunner.runnerID | quote }}
spec:
  replicas: {{ .Values.k8sRunner.replicaCount }}
  selector:
    matchLabels:
      {{- include "nopsai.selectorLabels" (dict "root" . "component" "k8s-runner") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nopsai.selectorLabels" (dict "root" . "component" "k8s-runner") | nindent 8 }}
        nopsai.io/runner-id: {{ .Values.k8sRunner.runnerID | quote }}
        nopsai.io/platform-id: {{ include "nopsai.platformID" . | quote }}
    spec:
      serviceAccountName: {{ include "nopsai.runnerServiceAccountName" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runner
          image: {{ include "nopsai.image" .Values.k8sRunner.image | quote }}
          imagePullPolicy: {{ .Values.k8sRunner.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - {name: NOPSAI_SERVICE_NAME, value: k8s-runner}
            - {name: NOPSAI_ENVIRONMENT, value: {{ .Values.global.environment | quote }}}
            - {name: LOG_LEVEL, value: {{ .Values.global.logLevel | quote }}}
            - {name: LOG_FORMAT, value: {{ .Values.global.logFormat | quote }}}
            - {name: RUNTIME, value: kubernetes}
            - {name: RUNNER_ID, value: {{ .Values.k8sRunner.runnerID | quote }}}
            - {name: RUNNER_SCOPES, value: {{ .Values.k8sRunner.scopes | quote }}}
            - {name: RUNNER_CAPACITY, value: {{ .Values.k8sRunner.capacity | quote }}}
            - {name: NOPSAI_PLATFORM_ID, value: {{ include "nopsai.platformID" . | quote }}}
            - {name: KUBERNETES_RUNNER_LABEL_SELECTOR, value: {{ printf "app.kubernetes.io/name=nopsai,app.kubernetes.io/instance=%s,app.kubernetes.io/component=k8s-runner,nopsai.io/runner-id=%s,nopsai.io/platform-id=%s" .Release.Name .Values.k8sRunner.runnerID (include "nopsai.platformID" .) | quote }}}
            - {name: RUNNER_SERVICE_ID, value: {{ include "nopsai.runnerServiceID" . | quote }}}
            - {name: AGENT_IMAGE, value: {{ include "nopsai.image" .Values.agent.image | quote }}}
            - {name: DISPATCHER_GRPC_ADDRESS, value: {{ include "nopsai.topology.dispatcherGRPCAddress" . | quote }}}
            - {name: KUBERNETES_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: KUBERNETES_SERVICE_ACCOUNT, value: {{ include "nopsai.runnerServiceAccountName" . | quote }}}
            - {name: KUBERNETES_WORKLOAD_SERVICE_ACCOUNT, value: {{ include "nopsai.runnerWorkloadServiceAccountName" . | quote }}}
            - {name: KUBERNETES_WORKLOAD_AUTOMOUNT_SERVICE_ACCOUNT_TOKEN, value: {{ .Values.k8sRunner.workload.serviceAccount.automountServiceAccountToken | quote }}}
            {{- $workloadImagePullSecretNames := include "nopsai.imagePullSecretNames" $workloadImagePullSecrets }}
            {{- if $workloadImagePullSecretNames }}
            - {name: KUBERNETES_IMAGE_PULL_SECRETS, value: {{ $workloadImagePullSecretNames | quote }}}
            {{- end }}
            - {name: KUBERNETES_DEFAULT_IMAGE_PULL_POLICY, value: {{ .Values.k8sRunner.imagePullPolicy | quote }}}
            - {name: KUBERNETES_DEFAULT_WORKSPACE_SIZE, value: {{ .Values.k8sRunner.workspace.size | quote }}}
            - {name: KUBERNETES_DEFAULT_WORKSPACE_ACCESS_MODE, value: {{ .Values.k8sRunner.workspace.accessMode | quote }}}
            - {name: KUBERNETES_WORKSPACE_VOLUME_MODE, value: {{ .Values.k8sRunner.workspace.volumeMode | quote }}}
            - {name: KUBERNETES_DEFAULT_TASK_TIMEOUT, value: {{ .Values.k8sRunner.defaultTaskTimeout | quote }}}
            - {name: KUBERNETES_DEFAULT_RUN_TIMEOUT, value: {{ .Values.k8sRunner.defaultRunTimeout | quote }}}
            - {name: KUBERNETES_AFFINITY_ENABLED, value: {{ .Values.k8sRunner.affinityEnabled | quote }}}
            - {name: KUBERNETES_CLEANUP_FINISHED_PODS, value: {{ .Values.k8sRunner.cleanupFinishedPods | quote }}}
            {{- with .Values.k8sRunner.workspace.existingPVC }}
            - {name: KUBERNETES_EXISTING_WORKSPACE_PVC, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.k8sRunner.workspace.storageClass }}
            - {name: KUBERNETES_STORAGE_CLASS, value: {{ . | quote }}}
            {{- end }}
            - name: SERVICE_JWT_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ .Values.secrets.keys.serviceJWTSigningKey }}}}
            - name: DISPATCHER_TLS_SECRET
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ required "secrets.keys.dispatcherTLSSecret is required" .Values.secrets.keys.dispatcherTLSSecret }}}}
          resources: {{ toYaml .Values.k8sRunner.resources | nindent 12 }}
{{- end }}
