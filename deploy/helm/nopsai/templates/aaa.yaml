apiVersion: apps/v1
kind: Deployment
metadata:
  name: nopsai-aaa
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: aaa
spec:
  replicas: {{ .Values.aaa.replicaCount }}
  selector:
    matchLabels:
      {{- include "nopsai.selectorLabels" (dict "root" . "component" "aaa") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nopsai.selectorLabels" (dict "root" . "component" "aaa") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aaa
          image: {{ include "nopsai.image" .Values.aaa.image | quote }}
          imagePullPolicy: {{ .Values.aaa.imagePullPolicy }}
          ports: [{name: http, containerPort: 8082}]
          env:
            - {name: NOPSAI_ENVIRONMENT, value: {{ .Values.global.environment | quote }}}
            - {name: AAA_LISTEN_ADDRESS, value: ":8082"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ .Values.secrets.keys.databaseURL }}}}
            - name: AAA_SHARED_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ .Values.secrets.keys.aaaSharedInternalToken }}}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {{ toYaml .Values.aaa.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: aaa
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: aaa
spec:
  selector:
    {{- include "nopsai.selectorLabels" (dict "root" . "component" "aaa") | nindent 4 }}
  ports: [{name: http, port: {{ .Values.aaa.service.port }}, targetPort: http}]
