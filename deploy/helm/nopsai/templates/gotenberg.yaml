{{- if .Values.gotenberg.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nopsai-gotenberg
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
spec:
  replicas: {{ .Values.gotenberg.replicaCount }}
  selector:
    matchLabels:
      {{- include "nopsai.selectorLabels" (dict "root" . "component" "gotenberg") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nopsai.selectorLabels" (dict "root" . "component" "gotenberg") | nindent 8 }}
    spec:
      containers:
        - name: gotenberg
          image: {{ include "nopsai.image" .Values.gotenberg.image | quote }}
          imagePullPolicy: {{ .Values.gotenberg.imagePullPolicy }}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {{ toYaml .Values.gotenberg.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
spec:
  selector:
    {{- include "nopsai.selectorLabels" (dict "root" . "component" "gotenberg") | nindent 4 }}
  ports: [{name: http, port: {{ .Values.gotenberg.service.port }}, targetPort: http}]
{{- end }}
