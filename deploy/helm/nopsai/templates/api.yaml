{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nopsai.apiServiceAccountName" . }}
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}
{{- if and (eq (include "nopsai.systemLogsKubernetesEnabled" .) "true") .Values.systemLogs.kubernetes.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nopsai-api-system-logs
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nopsai-api-system-logs
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
subjects:
  - kind: ServiceAccount
    name: {{ include "nopsai.apiServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nopsai-api-system-logs
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nopsai-api
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "nopsai.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/release: {{ printf "%s:%s" .Values.global.releaseVersion .Values.global.sourceCommit | sha256sum }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nopsai.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nopsai.apiServiceAccountName" . }}
      containers:
        - name: api
          image: {{ include "nopsai.image" .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: NOPSAI_SERVICE_NAME, value: nopsai}
            - {name: NOPSAI_ENVIRONMENT, value: {{ .Values.global.environment | quote }}}
            - {name: LOG_LEVEL, value: {{ .Values.global.logLevel | quote }}}
            - {name: LOG_FORMAT, value: {{ .Values.global.logFormat | quote }}}
            - {name: NOPSAI_LISTEN_ADDRESS, value: "0.0.0.0:8080"}
            - {name: AAA_API_URL, value: {{ include "nopsai.topology.aaaAPIURL" . | quote }}}
            - {name: GIT_BOT_API_URL, value: {{ include "nopsai.topology.gitBotAPIURL" . | quote }}}
            - {name: NOPSAI_API_URL, value: {{ include "nopsai.topology.nopsaiAPIURL" . | quote }}}
            - {name: DISPATCHER_GRPC_ADDRESS, value: {{ include "nopsai.topology.dispatcherGRPCAddress" . | quote }}}
            - {name: NOPSAI_BOOTSTRAP_ADMIN_EMAIL, value: {{ required "bootstrapAdmin.email is required" .Values.bootstrapAdmin.email | quote }}}
            {{- if and .Values.systemLogs.enabled .Values.systemLogs.provider }}
            - {name: SYSTEM_LOGS_PROVIDER, value: {{ .Values.systemLogs.provider | quote }}}
            {{- end }}
            {{- if and .Values.systemLogs.enabled .Values.systemLogs.dockerHost }}
            - {name: SYSTEM_LOGS_DOCKER_HOST, value: {{ .Values.systemLogs.dockerHost | quote }}}
            {{- end }}
            {{- if eq (include "nopsai.systemLogsKubernetesEnabled" .) "true" }}
            - {name: SYSTEM_LOGS_KUBERNETES_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: SYSTEM_LOGS_KUBERNETES_LABEL_SELECTOR, value: {{ include "nopsai.systemLogsKubernetesLabelSelector" . | quote }}}
            {{- with .Values.systemLogs.kubernetes.container }}
            - {name: SYSTEM_LOGS_KUBERNETES_CONTAINER, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            - {name: AGENT_IMAGE, value: {{ include "nopsai.image" .Values.agent.image | quote }}}
            {{- if .Values.gotenberg.enabled }}
            - {name: FINAL_OUTPUT_PDF_RENDERER_URL, value: {{ include "nopsai.topology.gotenbergURL" . | quote }}}
            {{- end }}
            - {name: RUNTIME_OUTPUT_MAX_BYTES, value: {{ .Values.api.runtimeOutputMaxBytes | quote }}}
            - {name: METRICS_REQUIRE_AUTH, value: {{ .Values.api.metricsRequireAuth | quote }}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ .Values.secrets.keys.databaseURL }}}}
            - name: NOPSAI_MASTER_KEY
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ .Values.secrets.keys.masterKey }}}}
            - {name: NOPSAI_PLATFORM_ID, value: {{ include "nopsai.platformID" . | quote }}}
            - name: JWT_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ .Values.secrets.keys.jwtSigningKey }}}}
            - name: SERVICE_JWT_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ .Values.secrets.keys.serviceJWTSigningKey }}}}
            - name: DISPATCHER_TLS_SECRET
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ required "secrets.keys.dispatcherTLSSecret is required" .Values.secrets.keys.dispatcherTLSSecret }}}}
            - name: AAA_SHARED_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ .Values.secrets.keys.aaaSharedInternalToken }}}}
            {{- with .Values.secrets.keys.bootstrapAdminPassword }}
            - name: NOPSAI_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" $ }}, key: {{ . | quote }}}}
            {{- end }}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /livez, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nopsai
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "nopsai.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
