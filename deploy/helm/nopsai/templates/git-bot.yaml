apiVersion: apps/v1
kind: Deployment
metadata:
  name: nopsai-git-bot
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: git-bot
spec:
  replicas: {{ .Values.gitBot.replicaCount }}
  selector:
    matchLabels:
      {{- include "nopsai.selectorLabels" (dict "root" . "component" "git-bot") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nopsai.selectorLabels" (dict "root" . "component" "git-bot") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: git-bot
          image: {{ include "nopsai.image" .Values.gitBot.image | quote }}
          imagePullPolicy: {{ .Values.gitBot.imagePullPolicy }}
          ports: [{name: http, containerPort: 8081}]
          env:
            - {name: NOPSAI_ENVIRONMENT, value: {{ .Values.global.environment | quote }}}
            - {name: GIT_BOT_LISTEN_ADDRESS, value: "0.0.0.0:8081"}
            - {name: NOPSAI_API_URL, value: "http://nopsai:8080"}
            - name: SERVICE_JWT_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: {{ include "nopsai.secretName" . }}, key: {{ .Values.secrets.keys.serviceJWTSigningKey }}}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {{ toYaml .Values.gitBot.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: git-bot
  labels:
    {{- include "nopsai.labels" . | nindent 4 }}
    app.kubernetes.io/component: git-bot
spec:
  selector:
    {{- include "nopsai.selectorLabels" (dict "root" . "component" "git-bot") | nindent 4 }}
  ports: [{name: http, port: {{ .Values.gitBot.service.port }}, targetPort: http}]
