name: nopsai

networks:
  nopsai-net:
    name: nopsai-net

volumes:
  db:
    name: nopsai-db

x-service-auth-env: &service-auth-env
  SERVICE_JWT_SIGNING_KEY: ${SERVICE_JWT_SIGNING_KEY:?SERVICE_JWT_SIGNING_KEY is required}

x-local-topology-env: &local-topology-env
  AGENT_NOPSAI_API_URL: http://nopsai:8080
  DISPATCHER_ADDRESS: dispatcher:9090
  DOCKER_NETWORK_NAME: nopsai-net

services:
  db:
    container_name: nopsai-db
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nopsai_db}
      POSTGRES_USER: ${POSTGRES_USER:-nopsai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nopsai_user} -d ${POSTGRES_DB:-nopsai_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nopsai-net]

  aaa:
    container_name: nopsai-aaa
    image: ${NOPSAI_AAA_IMAGE:?release bundle .env is required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AAA_SHARED_INTERNAL_TOKEN: ${AAA_SHARED_INTERNAL_TOKEN:?AAA_SHARED_INTERNAL_TOKEN is required}
      NOPSAI_ENVIRONMENT: ${NOPSAI_ENVIRONMENT:-production}
    networks: [nopsai-net]

  docker-socket-proxy:
    container_name: nopsai-docker-socket-proxy
    image: ${NOPSAI_DOCKER_SOCKET_PROXY_IMAGE:?release bundle .env is required}
    restart: unless-stopped
    environment:
      ALLOWED_CONTAINERS: nopsai,nopsai-aaa,nopsai-dispatcher,nopsai-git-bot,nopsai-ui,nopsai-docker-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [nopsai-net]

  gotenberg:
    container_name: nopsai-gotenberg
    image: gotenberg/gotenberg:8.32.0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nopsai-net]

  nopsai:
    container_name: nopsai
    image: ${NOPSAI_API_IMAGE:?release bundle .env is required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      aaa:
        condition: service_started
      gotenberg:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    ports:
      - "${NOPSAI_API_PORT:-8080}:8080"
    environment:
      <<: [*service-auth-env, *local-topology-env]
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NOPSAI_MASTER_KEY: ${NOPSAI_MASTER_KEY:?NOPSAI_MASTER_KEY is required}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      AAA_API_URL: http://aaa:8082
      AAA_SHARED_INTERNAL_TOKEN: ${AAA_SHARED_INTERNAL_TOKEN:?AAA_SHARED_INTERNAL_TOKEN is required}
      NOPSAI_GIT_BOT_API_URL: http://git-bot:8081
      FINAL_OUTPUT_PDF_RENDERER_URL: http://gotenberg:3000
      SYSTEM_LOGS_DOCKER_HOST: tcp://docker-socket-proxy:2375
      AGENT_IMAGE: ${NOPSAI_AGENT_IMAGE:?release bundle .env is required}
      NOPSAI_ENVIRONMENT: ${NOPSAI_ENVIRONMENT:-production}
    networks: [nopsai-net]

  dispatcher:
    container_name: nopsai-dispatcher
    image: ${NOPSAI_DISPATCHER_IMAGE:?release bundle .env is required}
    restart: unless-stopped
    depends_on:
      nopsai:
        condition: service_started
    environment:
      <<: *service-auth-env
      AGENT_NOPSAI_API_URL: http://nopsai:8080
      NOPSAI_ENVIRONMENT: ${NOPSAI_ENVIRONMENT:-production}
    networks: [nopsai-net]

  git-bot:
    container_name: nopsai-git-bot
    image: ${NOPSAI_GIT_BOT_IMAGE:?release bundle .env is required}
    restart: unless-stopped
    depends_on:
      nopsai:
        condition: service_started
    environment:
      <<: *service-auth-env
      GIT_BOT_LISTEN_ADDRESS: 0.0.0.0:8081
      GIT_BOT_NOPSAI_API_URL: http://nopsai:8080
      NOPSAI_ENVIRONMENT: ${NOPSAI_ENVIRONMENT:-production}
    networks: [nopsai-net]

  ui:
    container_name: nopsai-ui
    image: ${NOPSAI_UI_IMAGE:?release bundle .env is required}
    restart: unless-stopped
    depends_on:
      nopsai:
        condition: service_started
    ports:
      - "${NOPSAI_UI_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [nopsai-net]

  docker-runner:
    container_name: nopsai-docker-runner
    hostname: docker-runner
    image: ${NOPSAI_RUNNER_IMAGE:?release bundle .env is required}
    restart: unless-stopped
    depends_on:
      dispatcher:
        condition: service_started
    environment:
      <<: *service-auth-env
      DISPATCHER_ADDRESS: dispatcher:9090
      DOCKER_NETWORK_NAME: nopsai-net
      NOPSAI_ENVIRONMENT: ${NOPSAI_ENVIRONMENT:-production}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [nopsai-net]
