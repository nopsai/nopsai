# What a release declares that cannot be derived from the version series.
# The compatibility ranges are NOT here: they follow version.txt in the
# repository root, so moving the series needs no edit in this file.
apiCompatibility:
  - v1
runnerProtocolVersion: 1
capabilities:
  - api.v1
  - cli.api-catalog.v1
  - config-sync.v1
  - dashboard-refresh.v1
  - dashboards.v1
  - mcp.v1
  - monitoring.v1
  - platform.docker-compose
  - platform.helm
  - runner.docker
  - runner.kubernetes
  - runner.local-registry-auth.v1
  - runner.registry-auth.v1
